<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My account — CrochetHub</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
--bg:light-dark(#fff7fa,#1b0f1c);--ink:light-dark(#2a1430,#f6e8f1);--mute:light-dark(#6d5670,#c6aec4);
--plum:#4a1d4f;--blush:light-dark(#ffe3ec,#3a2040);--pink:#f48fb1;--gold:#ffb627;
--line:light-dark(#ecd9e4,#3d2742);--panel:light-dark(#ffffff,#2a182e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.6 "Nunito Sans",system-ui,sans-serif;overflow-x:clip;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{font-family:Outfit,system-ui,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
a{color:inherit}
.bar{background:var(--plum);color:#fff}
.bar .in{display:flex;align-items:center;gap:14px;padding:10px max(5vw,16px);max-width:1240px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;font:800 21px Outfit,sans-serif;text-decoration:none;color:#fff}
.bar .who{margin-left:auto;font-size:14.5px;color:#f6c8da;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border-radius:999px;font:700 15.5px Outfit,sans-serif;text-decoration:none;border:2px solid transparent;cursor:pointer}
.btn[disabled]{opacity:.6;cursor:wait}
.gold{background:var(--gold);color:#2a1430}.plumb{background:var(--plum);color:#fff}
.ghost{background:none;border-color:currentColor;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{flex:1;width:100%;max-width:1240px;margin:0 auto;padding:clamp(24px,4vw,56px) max(5vw,16px)}
.center{display:grid;place-items:center;min-height:60vh}
.box{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,3vw,34px);width:min(440px,100%);box-shadow:0 20px 40px rgba(74,29,79,.1)}
.box h1{font-size:32px;margin-bottom:6px}
.box p{color:var(--mute);margin:0 0 18px}
label{display:block;font-weight:700;font-size:14.5px;margin-bottom:12px}
label span{display:block;margin-bottom:5px}
input{width:100%;font:16px "Nunito Sans",sans-serif;min-height:46px;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink)}
input:focus{border-color:var(--plum);outline:none;box-shadow:0 0 0 3px rgba(244,143,177,.45)}
.err{color:#c62f5f;font-size:14px;min-height:20px;margin:-4px 0 8px}
.box .btn{width:100%}
.small{text-align:center;font-size:14.5px;color:var(--mute);margin-top:14px}
.small a{color:var(--ink);font-weight:700}
.welcome{background:var(--plum);color:#fff;border-radius:22px;padding:clamp(22px,3vw,34px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.welcome h1{font-size:clamp(28px,4vw,42px)}
.welcome p{margin:8px 0 0;color:#f6d3e2}
.badge{display:inline-block;background:var(--gold);color:#2a1430;font:700 14px Outfit,sans-serif;padding:5px 14px;border-radius:999px;white-space:nowrap}
.ribbon{background:#cdeedd;color:#155c3b;border-radius:14px;padding:12px 16px;margin:0 0 18px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
.card h3{font-size:19px;margin-bottom:12px}
.kv div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.kv div:first-child{border-top:0}
.kv b{text-align:right;overflow-wrap:anywhere}
.meter{height:10px;border-radius:999px;background:var(--blush);overflow:hidden;margin:4px 0 12px}
.meter span{display:block;height:100%;background:var(--pink)}
.use{font-size:14.5px;display:flex;justify-content:space-between;gap:8px}
.plans{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.pl{border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 10px}
.pl>b{grid-column:1}.pl>small{grid-column:1}.pl>.btn,.pl>.badge{grid-column:2;grid-row:1/3}
.pl.cur{border-color:var(--plum);background:var(--blush)}
.pl b{font:700 17px Outfit,sans-serif}.pl small{color:var(--mute)}
.pl .btn{min-height:40px;font-size:14px;padding:0 16px}
.msg{min-height:22px;font-size:14px;margin-top:10px;color:var(--mute)}
.wide{grid-column:span 2}
.loading{color:var(--mute);text-align:center;padding:60px 0}
.mini{font:700 13px "Nunito Sans",sans-serif;border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:34px}
.full{grid-column:1/-1}
.pill{font:700 13px "Nunito Sans",sans-serif;color:var(--mute)}
.ord{border:1px solid var(--line);border-radius:14px;margin-top:10px;overflow:hidden}
.ord summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto auto;gap:6px 14px;align-items:center;padding:12px 14px}
.ord summary::-webkit-details-marker{display:none}
.ord summary small{grid-column:1/-1;color:var(--mute);margin-top:-4px}
.ord summary span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ob{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding:4px 14px 14px;border-top:1px solid var(--line)}
.cust{font-size:14.5px;line-height:1.6;padding-top:8px}
.cust select{width:100%;min-height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:15px "Nunito Sans",sans-serif;padding:0 10px}
.st{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--blush)}
.st-new{background:#ffe7b0;color:#6b4300}.st-completed{background:#cdeedd;color:#155c3b}.st-cancelled{background:#eee3e9;color:#6d5670}
@media(max-width:700px){.ord summary{grid-template-columns:minmax(0,1fr) auto}.ob{grid-template-columns:minmax(0,1fr)}}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}.wide{grid-column:auto}.welcome{grid-template-columns:minmax(0,1fr)}}

footer{background:#2f1233;color:#e7c5d5;font-size:14px;text-align:center;padding:18px}
</style>
</head>
<body>
<header class="bar"><div class="in">
  <a class="logo" href="/" aria-label="CrochetHub home">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="#f48fb1"/><path d="M5 11c6 4 14 4 20 0M4 16c7 4 15 4 22 0M6 21c6 3 12 3 18 0" stroke="#fff" stroke-opacity=".55" stroke-width="1.8" fill="none"/><path d="M8 26 26 5" stroke="#ffb627" stroke-width="3" stroke-linecap="round"/></svg>
    CrochetHub
  </a>
  <span class="who" id="who"></span>
  <a href="/products.html" id="prodLink" hidden style="color:#fff;font-weight:700;text-decoration:none;padding:10px 8px;white-space:nowrap">My products</a>
  <button class="btn ghost" id="logout" type="button" hidden style="min-height:40px;color:#fff">Log out</button>
</div></header>

<main id="main"><div class="loading">Loading your account…</div></main>

<footer>© 2026 CrochetHub · <a href="/">Back to website</a></footer>

<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const main=$('main');
const ALL=[['starter','Starter',29],['professional','Professional',59],['business','Business',99]];
const FEAT=[['dashboard','Dashboard'],['pricingCalculator','Pricing calculator'],['onlineStore','Online store'],['customers','Customer management'],['inventory','Inventory'],['salesReports','Sales reports'],['productionTracking','Production tracking'],['staffAccounts','Staff accounts']];
const lim=v=>v===null?'Unlimited':v===0?'Not included':String(v);

async function api(path,opts={}){
  const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opts});
  const j=await r.json().catch(()=>({}));return{ok:r.ok,status:r.status,data:j};
}

function showLogin(note){
  $('who').textContent='';$('logout').hidden=true;$('prodLink').hidden=true;
  main.innerHTML=`<div class="center"><form class="box" id="lf" novalidate>
    <h1>Log in</h1><p>Welcome back to your CrochetHub workspace.</p>
    ${note?`<div class="ribbon">${esc(note)}</div>`:''}
    <label><span>User ID</span><input id="lu" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label><span>Password</span><input id="lp" type="password" autocomplete="current-password" required></label>
    <div class="err" id="lerr" role="alert"></div>
    <button class="btn plumb" id="lbtn" type="submit">Log in</button>
    <p class="small">New to CrochetHub? <a href="/#join">Create an account</a></p>
  </form></div>`;
  $('lu').focus();
  $('lf').addEventListener('submit',async e=>{e.preventDefault();
    const userId=$('lu').value.trim(),password=$('lp').value;
    if(!userId||!password){$('lerr').textContent='Please enter your user ID and password.';return}
    const b=$('lbtn');b.disabled=true;b.textContent='Logging in…';
    try{const r=await api('/api/login',{method:'POST',body:JSON.stringify({userId,password})});
      if(!r.ok){$('lerr').textContent=r.data.error||'Could not log in.';return}
      showAccount(r.data.user,false)}
    catch{$('lerr').textContent='Network problem — please try again.'}
    finally{b.disabled=false;b.textContent='Log in'}
  });
}

function showAccount(u,welcome){
  const p=u.planDetails;
  $('who').textContent='@'+u.userId;$('logout').hidden=false;$('prodLink').hidden=false;
  const since=new Date(u.createdAt).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  const usage=[['Products',u.productCount||0,p.limits.products],['Quotations this month',0,p.limits.quotationsPerMonth],['Invoices this month',0,p.limits.invoicesPerMonth]];
  main.innerHTML=`
  ${!u.whatsapp?`<div class="ribbon" style="background:#ffe7b0;color:#6b4300">Add your WhatsApp number (Edit details) so customer orders from your shop reach you on WhatsApp too.</div>`:''}
  ${welcome?`<div class="ribbon">Your account is ready. Your ${esc(p.name)} plan is active — payment was skipped for now.</div>`:''}
  <section class="welcome">
    <div><h1>Hi ${esc(u.name.split(' ')[0])}, welcome to ${esc(u.business)}</h1>
    <p>Your CrochetHub workspace on the ${esc(p.name)} plan.</p></div>
    <div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start">
      <span class="badge">${esc(p.name)} · AED ${p.price}/month</span>
      <a class="btn gold" href="/products.html">Post a product</a>
      <a href="/shop.html?u=${encodeURIComponent(u.userId)}" target="_blank" rel="noopener" style="color:#fff;font-weight:700">View my shop →</a>
    </div>
  </section>
  <div class="grid">
    <div class="card"><h3 style="display:flex;justify-content:space-between;align-items:center">Account <button class="mini" type="button" id="editBtn">Edit details</button></h3>
      <div class="kv" id="kvView">
      <div><span>User ID</span><b>${esc(u.userId)}</b></div>
      <div><span>Name</span><b>${esc(u.name)}</b></div>
      <div><span>Business</span><b>${esc(u.business)}</b></div>
      <div><span>Email</span><b>${esc(u.email)}</b></div>
      <div><span>WhatsApp</span><b>${u.whatsapp?esc(u.whatsapp):'<span style="color:#c62f5f">Not set</span>'}</b></div>
      <div><span>Member since</span><b>${esc(since)}</b></div>
      </div>
      <form id="editForm" hidden novalidate>
        <label><span>Name</span><input id="eName" value="${esc(u.name)}" maxlength="80"></label>
        <label><span>Business name</span><input id="eBiz" value="${esc(u.business)}" maxlength="80"></label>
        <label><span>Email</span><input id="eEmail" type="email" value="${esc(u.email)}"></label>
        <label><span>WhatsApp number</span><input id="eWa" type="tel" inputmode="tel" value="${esc(u.whatsapp||'')}" placeholder="+971 55 123 4567"></label>
        <div class="err" id="eErr" role="alert"></div>
        <div style="display:flex;gap:8px"><button class="btn plumb" type="submit" style="flex:1">Save</button><button class="btn ghost" type="button" id="eCancel" style="color:var(--ink);border-color:var(--line)">Cancel</button></div>
      </form>
    </div>
    <div class="card"><h3>Subscription</h3><div class="kv">
      <div><span>Plan</span><b>${esc(p.name)}</b></div>
      <div><span>Price</span><b>AED ${p.price} / month</b></div>
      <div><span>Status</span><b style="color:#2f9e6b">Active</b></div>
      <div><span>Payment</span><b>Skipped for now</b></div>
      <div><span>Staff accounts</span><b>${esc(lim(p.limits.staff)==='Not included'?'Not included':lim(p.limits.staff)==='Unlimited'?'Multiple':lim(p.limits.staff))}</b></div>
    </div></div>
    <div class="card"><h3>Plan usage</h3>
      ${usage.map(([t,used,max])=>`<div class="use"><span>${t}</span><b>${used} / ${max===null?'∞':max}</b></div><div class="meter"><span style="width:${max?Math.min(100,used/max*100):0}%"></span></div>`).join('')}
    </div>
    <div class="card wide"><h3>What your plan includes</h3><div class="kv">
      ${FEAT.map(([k,t])=>`<div><span>${t}</span><b>${esc(p.features[k])}</b></div>`).join('')}
    </div></div>
    <div class="card"><h3>Change plan</h3>
      <div class="plans" id="plans">${ALL.map(([id,n,pr])=>`<div class="pl${id===u.plan?' cur':''}"><b>${n}</b><small>AED ${pr}/month</small>${id===u.plan?'<span class="badge" style="text-align:center">Current plan</span>':`<button class="btn plumb" type="button" data-plan="${id}">Switch</button>`}</div>`).join('')}</div>
      <div class="msg" id="pmsg" role="status"></div>
    </div>
    <div class="card full"><h3 style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">Orders from your shop <span class="pill" id="ocount"></span></h3>
      <div id="orders"><p class="msg">Loading orders…</p></div>
    </div>
  </div>`;
  $('plans').addEventListener('click',async e=>{const b=e.target.closest('[data-plan]');if(!b)return;
    b.disabled=true;b.textContent='Switching…';
    const r=await api('/api/plan',{method:'POST',body:JSON.stringify({plan:b.dataset.plan})}).catch(()=>({ok:false,data:{}}));
    if(r.ok){showAccount(r.data.user,false);$('pmsg').textContent='Plan updated — payment skipped for now.'}
    else if(r.status===401)showLogin('Your session ended. Please log in again.');
    else{$('pmsg').textContent=r.data.error||'Could not change plan.';b.disabled=false;b.textContent='Switch'}
  });
  $('editBtn').addEventListener('click',()=>{$('kvView').hidden=true;$('editForm').hidden=false;$('editBtn').hidden=true;$('eWa').focus()});
  $('eCancel').addEventListener('click',()=>{$('kvView').hidden=false;$('editForm').hidden=true;$('editBtn').hidden=false});
  $('editForm').addEventListener('submit',async e=>{e.preventDefault();
    const r=await api('/api/profile',{method:'POST',body:JSON.stringify({name:$('eName').value,business:$('eBiz').value,email:$('eEmail').value,whatsapp:$('eWa').value})}).catch(()=>({ok:false,data:{}}));
    if(r.ok)showAccount({...r.data.user,productCount:u.productCount},false);
    else if(r.status===401)showLogin('Your session ended. Please log in again.');
    else $('eErr').textContent=r.data.error||'Could not save.'});
  loadOrders();
}

const ST=[['new','New'],['confirmed','Confirmed'],['in_production','In production'],['ready','Ready for delivery'],['completed','Completed'],['cancelled','Cancelled']];
const aed=n=>'AED '+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const wa=n=>'https://wa.me/'+String(n).replace(/\D/g,'');
async function loadOrders(){
  const r=await api('/api/orders').catch(()=>({ok:false,data:{}}));
  if(!$('orders'))return;
  if(!r.ok){$('orders').innerHTML='<p class="msg">Could not load orders.</p>';return}
  renderOrders(r.data.orders||[]);
}
function renderOrders(list){
  const open=list.filter(o=>!['completed','cancelled'].includes(o.status)).length;
  $('ocount').textContent=list.length?`${open} open · ${list.length} total`:'';
  if(!list.length){$('orders').innerHTML='<p class="msg">No orders yet. Share your shop link with customers — their orders will appear here, in your email and on WhatsApp.</p>';return}
  $('orders').innerHTML=list.map(o=>`<details class="ord"${o.status==='new'?' open':''}><summary><b>${esc(o.orderNo)}</b><span>${esc(o.customer.name)}</span><span>${aed(o.total)}</span><span class="st st-${esc(o.status)}">${esc((ST.find(s=>s[0]===o.status)||['','New'])[1])}</span><small>${esc(new Date(o.createdAt).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))}</small></summary>
    <div class="ob"><div><div class="kv">${o.items.map(i=>`<div><span>${i.qty} × ${esc(i.name)}</span><b>${aed(i.lineTotal)}</b></div>`).join('')}<div><span><b>Total</b></span><b>${aed(o.total)}</b></div></div></div>
    <div class="cust"><b>${esc(o.customer.name)}</b><br><a href="mailto:${esc(o.customer.email)}">${esc(o.customer.email)}</a><br><a href="${wa(o.customer.whatsapp)}" target="_blank" rel="noopener">WhatsApp ${esc(o.customer.whatsapp)}</a><br><span>${esc(o.customer.address)}</span>${o.customer.notes?`<br><i>“${esc(o.customer.notes)}”</i>`:''}
    <label style="margin-top:10px"><span>Status</span><select data-o="${esc(o.id)}">${ST.map(([k,t])=>`<option value="${k}"${k===o.status?' selected':''}>${t}</option>`).join('')}</select></label></div></div></details>`).join('');
  $('orders').onchange=async e=>{const sel=e.target.closest('select[data-o]');if(!sel)return;sel.disabled=true;
    const r=await api('/api/orders?id='+encodeURIComponent(sel.dataset.o),{method:'PUT',body:JSON.stringify({status:sel.value})}).catch(()=>({ok:false,data:{}}));
    if(r.ok)renderOrders(r.data.orders);else{sel.disabled=false;alertMsg('Could not update the order.')}};
}
function alertMsg(m){const p=$('pmsg');if(p)p.textContent=m}
$('logout').addEventListener('click',async()=>{await api('/api/logout',{method:'POST'}).catch(()=>{});showLogin('You have logged out.')});

(async()=>{
  const welcome=new URLSearchParams(location.search).has('welcome');
  if(welcome)history.replaceState(null,'','/account.html');
  try{const r=await api('/api/me');if(r.ok)showAccount(r.data.user,welcome);else showLogin()}
  catch{showLogin()}
})();
}
</script>
</body>
</html>
