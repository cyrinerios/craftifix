<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My account — CrochetHub</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
--bg:light-dark(#fff7fa,#1b0f1c);--ink:light-dark(#2a1430,#f6e8f1);--mute:light-dark(#6d5670,#c6aec4);
--plum:#4a1d4f;--blush:light-dark(#ffe3ec,#3a2040);--pink:#f48fb1;--gold:#ffb627;
--line:light-dark(#ecd9e4,#3d2742);--panel:light-dark(#ffffff,#2a182e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.6 "Nunito Sans",system-ui,sans-serif;overflow-x:clip;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{font-family:Outfit,system-ui,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
a{color:inherit}
.bar{background:var(--plum);color:#fff}
.bar .in{display:flex;align-items:center;gap:14px;padding:10px max(5vw,16px);max-width:1240px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;font:800 21px Outfit,sans-serif;text-decoration:none;color:#fff}
.bar .who{margin-left:auto;font-size:14.5px;color:#f6c8da;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border-radius:999px;font:700 15.5px Outfit,sans-serif;text-decoration:none;border:2px solid transparent;cursor:pointer}
.btn[disabled]{opacity:.6;cursor:wait}
.gold{background:var(--gold);color:#2a1430}.plumb{background:var(--plum);color:#fff}
.ghost{background:none;border-color:currentColor;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{flex:1;width:100%;max-width:1240px;margin:0 auto;padding:clamp(24px,4vw,56px) max(5vw,16px)}
.center{display:grid;place-items:center;min-height:60vh}
.box{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,3vw,34px);width:min(440px,100%);box-shadow:0 20px 40px rgba(74,29,79,.1)}
.box h1{font-size:32px;margin-bottom:6px}
.box p{color:var(--mute);margin:0 0 18px}
label{display:block;font-weight:700;font-size:14.5px;margin-bottom:12px}
label span{display:block;margin-bottom:5px}
input,textarea,select{width:100%;font:16px "Nunito Sans",sans-serif;min-height:46px;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink)}
input:focus,textarea:focus{border-color:var(--plum);outline:none;box-shadow:0 0 0 3px rgba(244,143,177,.45)}
.err{color:#c62f5f;font-size:14px;min-height:20px;margin:-4px 0 8px}
.box .btn{width:100%}
.small{text-align:center;font-size:14.5px;color:var(--mute);margin-top:14px}
.small a{color:var(--ink);font-weight:700}
.welcome{background:var(--plum);color:#fff;border-radius:22px;padding:clamp(22px,3vw,34px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.welcome h1{font-size:clamp(28px,4vw,42px)}
.welcome p{margin:8px 0 0;color:#f6d3e2}
.badge{display:inline-block;background:var(--gold);color:#2a1430;font:700 14px Outfit,sans-serif;padding:5px 14px;border-radius:999px;white-space:nowrap}
.ribbon{background:#cdeedd;color:#155c3b;border-radius:14px;padding:12px 16px;margin:0 0 18px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
.card h3{font-size:19px;margin-bottom:12px}
.kv div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.kv div:first-child{border-top:0}
.kv b{text-align:right;overflow-wrap:anywhere}
.meter{height:10px;border-radius:999px;background:var(--blush);overflow:hidden;margin:4px 0 12px}
.meter span{display:block;height:100%;background:var(--pink)}
.use{font-size:14.5px;display:flex;justify-content:space-between;gap:8px}
.plans{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.pl{border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 10px}
.pl>b{grid-column:1}.pl>small{grid-column:1}.pl>.btn,.pl>.badge{grid-column:2;grid-row:1/3}
.pl.cur{border-color:var(--plum);background:var(--blush)}
.pl b{font:700 17px Outfit,sans-serif}.pl small{color:var(--mute)}
.pl .btn{min-height:40px;font-size:14px;padding:0 16px}
.msg{min-height:22px;font-size:14px;margin-top:10px;color:var(--mute)}
.wide{grid-column:span 2}
.planpill{display:inline-flex;align-items:center;gap:6px;flex:none;background:#ffb627;color:#2a1430;font:700 13px Outfit,sans-serif;padding:5px 11px;border-radius:999px;text-decoration:none;white-space:nowrap}
.planpill i{width:8px;height:8px;border-radius:50%;background:#2f9e6b;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.planpill:hover{filter:brightness(1.05)}
@media(max-width:640px){.planpill .pst{display:none}}
.mylogo{width:40px;height:40px;border-radius:50%;object-fit:cover;vertical-align:middle;border:1px solid var(--line)}
.soclinks a{color:var(--plum);text-decoration:underline}
.logoup{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;margin-bottom:12px}
.logobox{width:72px;height:72px;margin:0!important;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;cursor:pointer;overflow:hidden;background:var(--bg);text-align:center;font-size:11.5px;color:var(--mute);font-weight:700}
.logobox img{width:100%;height:100%;object-fit:cover}
.linkbtn{background:none;border:0;color:#b02a5a;font-weight:700;cursor:pointer;padding:4px 0;font-size:13.5px}
.wnav{display:flex;gap:2px;overflow-x:auto}
.wnav a{color:#fff;font-weight:700;text-decoration:none;padding:9px 12px;border-radius:999px;white-space:nowrap;font-size:14.5px}
.wnav a:hover{background:rgba(255,255,255,.12)}.wnav a.on{background:rgba(255,255,255,.2)}
.ofilter{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 6px}
.ofilter button,.anahead .seg button{min-height:36px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:700 13px "Nunito Sans",sans-serif;cursor:pointer}
.ofilter button[aria-pressed=true],.anahead .seg button[aria-pressed=true]{background:var(--plum);border-color:var(--plum);color:#fff}
.ana{margin-top:18px}
.anahead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.anahead h2{font-size:24px}.anahead .seg{display:flex;gap:6px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:2px}
.kpi:hover{border-color:var(--plum)}
.kpi small{color:var(--mute);font-weight:600;font-size:13px}
.kpi b{font:800 clamp(22px,2.4vw,28px)/1.1 Outfit,sans-serif;white-space:nowrap}
.kpi span{font-size:13px;color:var(--mute)}.kpi em{font-style:normal;color:#b02a5a;font-weight:700}
.agrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px;align-items:start}
.agrid .wide2{grid-column:span 2}
.bars{display:flex;align-items:flex-end;gap:3px;height:200px;padding-top:8px;border-bottom:1px solid var(--line)}
.bcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;min-width:0}
.bv{background:linear-gradient(#f48fb1,#d9669a);border-radius:5px 5px 0 0}
.bcol small{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--mute);white-space:nowrap}
.bars{margin-bottom:24px}
.hrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.hrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hrow b{font-variant-numeric:tabular-nums;white-space:nowrap}
.hb{height:10px;background:var(--blush);border-radius:999px;overflow:hidden}.hb i{display:block;height:100%;background:#d9669a;border-radius:999px}
.hb .c-new{background:#ffb627}.hb .c-confirmed{background:#8b7be0}.hb .c-in_production{background:#e0a100}.hb .c-ready{background:#4a90d9}.hb .c-completed{background:#2f9e6b}.hb .c-cancelled{background:#b8a9b6}.hb .c-inq{background:#4a1d4f}
.trow{margin:10px 0 12px}.trow .tn{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:5px}.trow .tn b{white-space:nowrap}.trow small{display:block;margin-top:3px;font-size:12.5px}
.act{list-style:none;padding:0;margin:0}.act li{padding:8px 0;border-top:1px solid var(--line);font-size:14px}.act li:first-child{border-top:0}
.act a{text-decoration:none}.act a:hover{text-decoration:underline}.act small{display:block;color:var(--mute)}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.agrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.agrid{grid-template-columns:minmax(0,1fr)}.agrid .wide2{grid-column:auto}.bars{height:160px}}
.sethead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:6px}
.sethead h1{font-size:clamp(28px,3.6vw,40px)}.sethead p{margin:6px 0 0;color:var(--mute)}
@media(max-width:640px){.bar .in{flex-wrap:wrap;row-gap:4px}.bar .who{display:none}#logout{margin-left:auto;min-height:36px!important;padding:0 14px;font-size:14px}.planpill{font-size:12px;padding:4px 9px}.bar .logo{font-size:18px;gap:8px}.bar .in{gap:8px}.wnav{order:3;width:100%;justify-content:space-between;gap:2px;scrollbar-width:none}.wnav a{padding:7px 8px;font-size:13.5px}}
#logout{white-space:nowrap}
@media(max-width:420px){.bar .logo{font-size:0!important;gap:0!important}}
.loading{color:var(--mute);text-align:center;padding:60px 0}
.mini{font:700 13px "Nunito Sans",sans-serif;border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:34px}
.full{grid-column:1/-1}
.sub4{font:700 15px Outfit,sans-serif;margin:14px 0 6px}
.thread{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.thread li{background:var(--blush);border-radius:12px;padding:8px 12px;font-size:14.5px}
.thread p{margin:2px 0;white-space:pre-wrap}.thread small{color:var(--mute)}
.replyf textarea{min-height:90px;resize:vertical}
.convf textarea{min-height:64px;resize:vertical}
.replyf .row2,.convf .row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.convert{margin-top:12px}.convert>summary{list-style:none;cursor:pointer}.convert>summary::-webkit-details-marker{display:none}
.convf{margin-top:10px;border:1.5px solid var(--gold);border-radius:14px;padding:12px}
.hint2{display:block;font-weight:400;font-size:12.5px;color:var(--mute);margin-top:4px}
.convok{margin-top:10px;background:#cdeedd;color:#155c3b;border-radius:12px;padding:10px 12px}
.srctag{font-size:12px;font-weight:700;background:#e2dcfb;color:#3b2a8a;border-radius:999px;padding:1px 8px;white-space:nowrap}
.flash{animation:fl 2s ease-out}@keyframes fl{0%{box-shadow:0 0 0 4px var(--gold)}100%{box-shadow:none}}
.st-in_production{background:#ffe7b0;color:#6b4300}
.iqmsg{white-space:pre-wrap;margin:10px 0 6px;font-size:15px}
.iqopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}
.iqopts figure{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.iqopts img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.iqopts .noimg{aspect-ratio:1;display:grid;place-items:center;color:var(--mute);background:var(--blush);font-size:13px}
.iqopts figcaption{padding:8px 10px;font-size:13.5px}
.alertsetup{background:#f0fbf4;border-color:#bfe8cf}.alertsetup ol{margin:8px 0;padding-left:20px;line-height:1.7}.alertsetup p{margin:6px 0}
.pill{font:700 13px "Nunito Sans",sans-serif;color:var(--mute)}
.ord{border:1px solid var(--line);border-radius:14px;margin-top:10px;overflow:hidden}
.ord summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto auto;gap:6px 14px;align-items:center;padding:12px 14px}
.ord summary::-webkit-details-marker{display:none}
.ord summary small{grid-column:1/-1;color:var(--mute);margin-top:-4px}
.ord summary span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ob{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding:4px 14px 14px;border-top:1px solid var(--line)}
.cust{font-size:14.5px;line-height:1.6;padding-top:8px}
.cust select{width:100%;min-height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:15px "Nunito Sans",sans-serif;padding:0 10px}
.note-ok{margin-top:10px;background:var(--blush);border-radius:12px;padding:10px 12px;font-size:14px}
.nrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;margin-top:6px}
.nrow .ok{color:#2f9e6b;font-weight:700}.nrow .warn{color:#8a5a00;font-weight:700}
.mini.wa{background:#25d366;border-color:#25d366;color:#0b3d1f;text-decoration:none}
a.mini{text-decoration:none;display:inline-flex;align-items:center}
.nerr{color:#c62f5f;font-size:14px;margin:8px 0 0}
.msgprev{margin-top:6px}.msgprev summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--mute)}
.msgprev pre{white-space:pre-wrap;font:13.5px/1.5 "Nunito Sans",sans-serif;background:var(--panel);border-radius:10px;padding:10px;margin:6px 0 0}
.hist{font-size:12.5px;color:var(--mute);margin:8px 0 0}
.st{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--blush)}
.st-new{background:#ffe7b0;color:#6b4300}.st-confirmed,.st-in_production,.st-ready{background:#e2dcfb;color:#3b2a8a}.st-completed{background:#cdeedd;color:#155c3b}.st-cancelled{background:#eee3e9;color:#6d5670}
@media(max-width:700px){.ord summary{grid-template-columns:minmax(0,1fr) auto}.ob{grid-template-columns:minmax(0,1fr)}}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}.wide{grid-column:auto}.welcome{grid-template-columns:minmax(0,1fr)}}

footer{background:#2f1233;color:#e7c5d5;font-size:14px;text-align:center;padding:18px}
</style>
</head>
<body>
<header class="bar"><div class="in">
  <a class="logo" href="/" aria-label="CrochetHub home">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="#f48fb1"/><path d="M5 11c6 4 14 4 20 0M4 16c7 4 15 4 22 0M6 21c6 3 12 3 18 0" stroke="#fff" stroke-opacity=".55" stroke-width="1.8" fill="none"/><path d="M8 26 26 5" stroke="#ffb627" stroke-width="3" stroke-linecap="round"/></svg>
    CrochetHub
  </a>
  <span class="who" id="who"></span>
  <a class="planpill" id="planPill" href="/account.html#settings" hidden title="Your plan — open Settings"></a>
  <nav id="wnav" class="wnav" hidden aria-label="Workspace"><a href="/account.html" data-v="dashboard">Dashboard</a><a href="/account.html#orders" data-v="orders">Orders</a><a href="/account.html#inquiries" data-v="inquiries">Inquiries</a><a href="/products.html" data-v="products">My products</a><a href="/account.html#settings" data-v="settings">Settings</a></nav>
  <button class="btn ghost" id="logout" type="button" hidden style="min-height:40px;color:#fff">Log out</button>
</div></header>

<main id="main"><div class="loading">Loading your account…</div></main>

<footer>© 2026 CrochetHub · <a href="/">Back to website</a></footer>

<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const main=$('main');
const ALL=[['starter','Starter',29],['professional','Professional',59],['business','Business',99]];
const FEAT=[['dashboard','Dashboard'],['pricingCalculator','Pricing calculator'],['onlineStore','Online store'],['customers','Customer management'],['inventory','Inventory'],['salesReports','Sales reports'],['productionTracking','Production tracking'],['staffAccounts','Staff accounts']];
const lim=v=>v===null?'Unlimited':v===0?'Not included':String(v);

async function api(path,opts={}){
  const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opts});
  const j=await r.json().catch(()=>({}));return{ok:r.ok,status:r.status,data:j};
}

function showLogin(note){
  $('who').textContent='';$('logout').hidden=true;$('wnav').hidden=true;$('planPill').hidden=true;
  main.innerHTML=`<div class="center"><form class="box" id="lf" novalidate>
    <h1>Log in</h1><p>Welcome back to your CrochetHub workspace.</p>
    ${note?`<div class="ribbon">${esc(note)}</div>`:''}
    <label><span>User ID</span><input id="lu" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label><span>Password</span><input id="lp" type="password" autocomplete="current-password" required></label>
    <div class="err" id="lerr" role="alert"></div>
    <button class="btn plumb" id="lbtn" type="submit">Log in</button>
    <p class="small">New to CrochetHub? <a href="/#join">Create an account</a></p>
  </form></div>`;
  $('lu').focus();
  $('lf').addEventListener('submit',async e=>{e.preventDefault();
    const userId=$('lu').value.trim(),password=$('lp').value;
    if(!userId||!password){$('lerr').textContent='Please enter your user ID and password.';return}
    const b=$('lbtn');b.disabled=true;b.textContent='Logging in…';
    try{const r=await api('/api/login',{method:'POST',body:JSON.stringify({userId,password})});
      if(!r.ok){$('lerr').textContent=r.data.error||'Could not log in.';return}
      showAccount(r.data.user,false)}
    catch{$('lerr').textContent='Network problem — please try again.'}
    finally{b.disabled=false;b.textContent='Log in'}
  });
}

let curUser=null;
function shrinkLogo(file){return new Promise((ok,no)=>{const img=new Image();img.onload=()=>{const m=400,k=Math.min(1,m/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(img.src);ok(file.type==='image/png'?cv.toDataURL('image/png'):cv.toDataURL('image/jpeg',.9))};img.onerror=()=>no(new Error('That file is not an image we can read.'));img.src=URL.createObjectURL(file)})}
function setNav(view){
  for(const a of document.querySelectorAll('#wnav a'))a.classList.toggle('on',a.dataset.v===view);
}
function showAccount(u,welcome){
  curUser=u;
  const p=u.planDetails;
  const view=({'#settings':'settings','#orders':'orders','#inquiries':'inquiries'})[location.hash]||'dashboard';
  $('who').textContent='@'+u.userId;$('logout').hidden=false;$('wnav').hidden=false;setNav(view);
  const st=(u.subscription?.status||'active');$('planPill').hidden=false;$('planPill').innerHTML=`<i style="background:${st==='active'?'#2f9e6b':'#c62f5f'}"></i>${esc(p.name)}<span class="pst"> · ${st==='active'?'Active':esc(st[0].toUpperCase()+st.slice(1))}</span>`;
  document.title=({settings:'Settings',orders:'Orders',inquiries:'Inquiries',dashboard:'Dashboard'})[view]+' — CrochetHub';
  const since=new Date(u.createdAt).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  const usage=[['Products',u.productCount||0,p.limits.products],['Quotations this month',0,p.limits.quotationsPerMonth],['Invoices this month',0,p.limits.invoicesPerMonth]];
  if(view==='settings'){
    main.innerHTML=`
  <section class="sethead"><div><h1>Settings</h1><p>Your account details, subscription and plan for ${esc(u.business)}.</p></div><a class="mini" href="/account.html">← Back to dashboard</a></section>
  <div class="grid">
    <div class="card"><h3 style="display:flex;justify-content:space-between;align-items:center">Account <button class="mini" type="button" id="editBtn">Edit details</button></h3>
      <div class="kv" id="kvView">
      <div><span>User ID</span><b>${esc(u.userId)}</b></div>
      <div><span>Name</span><b>${esc(u.name)}</b></div>
      <div><span>Business</span><b>${esc(u.business)}</b></div>

let anaData=null,anaRange='30';
async function loadAnalytics(u){
  const [o,q,pr]=await Promise.all([api('/api/orders'),api('/api/inquiries'),api('/api/products')].map(x=>x.catch(()=>({ok:false,data:{}}))));
  if(!$('ana'))return;
  if(!o.ok||!q.ok){$('ana').innerHTML='<p class="msg">Could not load analytics. Please refresh.</p>';return}
  anaData={orders:o.data.orders||[],inquiries:q.data.inquiries||[],products:pr.ok?(pr.data.products||[]):[]};
  renderAnalytics();
}
function renderAnalytics(){
  const box=$('ana');if(!box||!anaData)return;
  const now=Date.now(),days=anaRange==='all'?null:+anaRange,from=days?now-days*864e5:0;
  const inRange=d=>new Date(d).getTime()>=from;
  const orders=anaData.orders.filter(o=>inRange(o.createdAt)),inqs=anaData.inquiries.filter(q=>inRange(q.createdAt)),prods=anaData.products;
  const live=orders.filter(o=>o.status!=='cancelled');
  const sales=live.reduce((s,o)=>s+o.total,0),completed=orders.filter(o=>o.status==='completed');
  const openAll=anaData.orders.filter(o=>!['completed','cancelled'].includes(o.status)).length;
  const aov=live.length?sales/live.length:0;
  const conv=inqs.filter(q=>q.status==='converted').length,convRate=inqs.length?conv/inqs.length:0;
  const openInq=anaData.inquiries.filter(q=>!['closed','converted'].includes(q.status)).length;
  const pub=prods.filter(p=>p.status==='published').length,low=prods.filter(p=>p.status==='published'&&p.quantity<=1);
  // sales over time
  let buckets=[];
  if(days){for(let k=days-1;k>=0;k--){const d=new Date(now-k*864e5);buckets.push({key:d.toISOString().slice(0,10),label:d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}),v:0,n:0})}
    for(const o of live){const b=buckets.find(x=>x.key===new Date(o.createdAt).toISOString().slice(0,10));if(b){b.v+=o.total;b.n++}}}
  else{const m=new Map();for(const o of live){const d=new Date(o.createdAt),k=d.toISOString().slice(0,7);if(!m.has(k))m.set(k,{key:k,label:d.toLocaleDateString('en-GB',{month:'short',year:'2-digit'}),v:0,n:0});m.get(k).v+=o.total;m.get(k).n++}
    buckets=[...m.values()].sort((a,b)=>a.key.localeCompare(b.key));if(!buckets.length){const d=new Date();buckets=[{key:'',label:d.toLocaleDateString('en-GB',{month:'short',year:'2-digit'}),v:0,n:0}]}}
  const maxV=Math.max(1,...buckets.map(b=>b.v));
  const every=buckets.length>14?Math.ceil(buckets.length/7):1;
  // status breakdown
  const stCount=ST.map(([k,t])=>[t,orders.filter(o=>o.status===k).length,k]);const maxSt=Math.max(1,...stCount.map(x=>x[1]));
  // top products
  const tp=new Map();for(const o of live)for(const it of o.items){const k=it.name;const c=tp.get(k)||{name:k,qty:0,rev:0};c.qty+=it.qty;c.rev+=it.lineTotal;tp.set(k,c)}
  const top=[...tp.values()].sort((a,b)=>b.rev-a.rev).slice(0,5),maxTop=Math.max(1,...top.map(t=>t.rev));
  // inquiry funnel
  const fun=[['Received',inqs.length],['Replied',inqs.filter(q=>(q.replies||[]).length).length],['Quoted',inqs.filter(q=>q.quote).length],['Converted to order',conv]];const maxF=Math.max(1,fun[0][1]);
  // recent activity
  const recent=[...anaData.orders.map(o=>({t:o.createdAt,html:`<b>${esc(o.orderNo)}</b> order from ${esc(o.customer.name)} · ${aed(o.total)}`,href:'#orders',st:(ST.find(s=>s[0]===o.status)||['',''])[1]})),...anaData.inquiries.map(q=>({t:q.createdAt,html:`<b>${esc(q.inqNo)}</b> inquiry from ${esc(q.customer.name)}`,href:'#inquiries',st:(IST.find(s=>s[0]===q.status)||['',''])[1]}))].sort((a,b)=>b.t.localeCompare(a.t)).slice(0,6);
  const rangeLabel={7:'last 7 days',30:'last 30 days',all:'all time'}[anaRange];
  box.innerHTML=`<div class="anahead"><h2>Shop analytics</h2><div class="seg" role="group" aria-label="Date range">${[['7','7 days'],['30','30 days'],['all','All time']].map(([k,t])=>`<button type="button" data-r="${k}" aria-pressed="${anaRange===k}">${t}</button>`).join('')}</div></div>
  <div class="kpis">
    <a class="kpi" href="#orders"><small>Sales · ${rangeLabel}</small><b>${aed(sales)}</b><span>${live.length} order${live.length===1?'':'s'} (excl. cancelled)</span></a>
    <a class="kpi" href="#orders"><small>Average order value</small><b>${aed(aov)}</b><span>${completed.length} completed</span></a>
    <a class="kpi" href="#orders"><small>Open orders</small><b>${openAll}</b><span>to make or deliver now</span></a>
    <a class="kpi" href="#inquiries"><small>Inquiries · ${rangeLabel}</small><b>${inqs.length}</b><span>${openInq} open now · ${Math.round(convRate*100)}% converted</span></a>
    <a class="kpi" href="/products.html"><small>Products in shop</small><b>${pub}</b><span>${prods.length} total${low.length?` · <em>${low.length} low on stock</em>`:''}</span></a>
  </div>
  <div class="agrid">
    <div class="card wide2"><h3>Sales ${days?'per day':'per month'}</h3>
      ${sales?`<div class="bars">${buckets.map((b,k)=>`<div class="bcol" title="${esc(b.label)}: ${aed(b.v)} · ${b.n} order${b.n===1?'':'s'}"><div class="bv" style="height:${Math.max(b.v?4:0,b.v/maxV*100)}%"></div><small>${k%every===0||k===buckets.length-1?esc(b.label):''}</small></div>`).join('')}</div>`:'<p class="msg">No sales in this period yet.</p>'}
    </div>
    <div class="card"><h3>Orders by status</h3>${orders.length?stCount.map(([t,n,k])=>`<div class="hrow"><span>${t}</span><div class="hb"><i class="c-${k}" style="width:${n/maxSt*100}%"></i></div><b>${n}</b></div>`).join(''):'<p class="msg">No orders in this period.</p>'}</div>
    <div class="card"><h3>Top products by sales</h3>${top.length?top.map(t=>`<div class="trow"><div class="tn"><span>${esc(t.name)}</span><b>${aed(t.rev)}</b></div><div class="hb"><i style="width:${t.rev/maxTop*100}%"></i></div><small class="msg">${t.qty} sold</small></div>`).join(''):'<p class="msg">No product sales in this period.</p>'}</div>
    <div class="card"><h3>Inquiry funnel</h3>${inqs.length?fun.map(([t,n])=>`<div class="hrow"><span>${t}</span><div class="hb"><i class="c-inq" style="width:${n/maxF*100}%"></i></div><b>${n}</b></div>`).join(''):'<p class="msg">No inquiries in this period.</p>'}</div>
    <div class="card"><h3>Recent activity</h3>${recent.length?`<ul class="act">${recent.map(a=>`<li><a href="${a.href}">${a.html}</a><small>${esc(fmtDT(a.t))} · ${esc(a.st)}</small></li>`).join('')}</ul>`:'<p class="msg">Nothing yet. Share your shop link to get your first order.</p>'}</div>
    ${low.length?`<div class="card"><h3>Low on stock</h3><ul class="act">${low.map(p=>`<li><a href="/products.html">${esc(p.name)}</a><small>${p.quantity} left · update stock in My products</small></li>`).join('')}</ul></div>`:''}
  </div>`;
  box.querySelector('.seg').onclick=e=>{const b=e.target.closest('[data-r]');if(!b)return;anaRange=b.dataset.r;renderAnalytics()};
}

    const id=sel.dataset.o,prev=list.find(o=>o.id===id)?.status;
    // Open the WhatsApp tab now (inside the click) so browsers don't block it; it is pointed at the message once ready.
    const w=sel.value!=='new'?window.open('about:blank','_blank'):null;
    sel.disabled=true;
    const r=await api('/api/orders?id='+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({status:sel.value})}).catch(()=>({ok:false,data:{}}));
    if(!r.ok){if(w)w.close();sel.value=prev;sel.disabled=false;showNote(id,{error:r.data.error||'Could not update the order.'});return}
    if(r.data.notification)notes.set(id,{...r.data.notification,auto:!!w});
    renderOrders(r.data.orders);
    const n=r.data.notification;
    if(w){if(n&&n.whatsappUrl)w.location.href=n.whatsappUrl;else w.close()}
  };
  $('orders').onclick=async e=>{const b=e.target.closest('[data-resend]');if(!b)return;
    const id=b.dataset.resend,w=window.open('about:blank','_blank');b.disabled=true;b.textContent='Sending…';
    const r=await api('/api/orders?id='+encodeURIComponent(id)+'&notify=1',{method:'PUT',body:'{}'}).catch(()=>({ok:false,data:{}}));
    if(!r.ok){if(w)w.close();b.disabled=false;b.textContent='Send update to customer';showNote(id,{error:r.data.error||'Could not send the update.'});return}
    notes.set(id,{...r.data.notification,auto:!!w});renderOrders(r.data.orders);
    if(w){if(r.data.notification?.whatsappUrl)w.location.href=r.data.notification.whatsappUrl;else w.close()}
  };
  for(const [id,n] of notes)showNote(id,n);
  if(openOrderId){const el=document.getElementById('ord-'+openOrderId);openOrderId=null;if(el){el.open=true;setTimeout(()=>{el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.add('flash')},50)}}
}
const notes=new Map();
function showNote(id,n){
  const box=document.getElementById('n-'+id);if(!box)return;
  if(n.error){box.innerHTML=`<p class="nerr">${esc(n.error)}</p>`;return}
  const label=(ST.find(s=>s[0]===n.status)||['',''])[1];
  box.innerHTML=`<div class="note-ok"><b>Customer update: ${esc(label)}</b>
    <div class="nrow"><span class="${n.emailSent?'ok':'warn'}">${n.emailSent?'✓ Email sent to customer':'Email not sent automatically'}</span>${n.mailtoUrl?`<a class="mini" href="${esc(n.mailtoUrl)}">Send email</a>`:''}</div>
    <div class="nrow"><span class="ok">${n.whatsappUrl?(n.auto?'✓ WhatsApp opened with the message':'WhatsApp message ready'):'No customer WhatsApp number'}</span>${n.whatsappUrl?`<a class="mini wa" href="${esc(n.whatsappUrl)}" target="_blank" rel="noopener">Open WhatsApp</a>`:''}</div>
    <details class="msgprev"><summary>See message</summary><pre>${esc(n.message)}</pre></details></div>`;
}
const IST=[['new','New'],['replied','Replied'],['quoted','Quoted'],['accepted','Customer accepted'],['converted','Converted to order'],['closed','Closed']];
const istClass={new:'new',replied:'confirmed',quoted:'confirmed',accepted:'in_production',converted:'completed',closed:'cancelled'};
const fmtDT=d=>new Date(d).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const iqOpen=new Set();
let inqCache=[];
async function loadInquiries(){
  const r=await api('/api/inquiries').catch(()=>({ok:false,data:{}}));
  if(!$('inquiries'))return;
  if(!r.ok){$('inquiries').innerHTML='<p class="msg">Could not load inquiries.</p>';return}
  renderInquiries(r.data.inquiries||[]);
}
function renderInquiries(list){
  inqCache=list;
  const open=list.filter(q=>!['closed','converted'].includes(q.status)).length;
  $('icount').textContent=list.length?`${open} open · ${list.length} total`:'';
  if(!list.length){$('inquiries').innerHTML='<p class="msg">No inquiries yet. Customers can send custom requests with inspiration photos from the “Custom inquiry” section of your shop.</p>';return}
  $('inquiries').innerHTML=list.map(q=>{
    const photos=q.options.filter(o=>o.image).length,first=q.customer.name.split(/\s+/)[0];
    const replies=q.replies||[];
    const conv=q.status==='converted';
    return `<details class="ord" data-qid="${esc(q.id)}"${q.status==='new'||iqOpen.has(q.id)?' open':''}><summary><b>${esc(q.inqNo)}</b><span>${esc(q.customer.name)}</span><span>${q.quote?aed(q.quote.price):photos+' photo'+(photos===1?'':'s')}</span><span class="st st-${istClass[q.status]||'new'}">${esc((IST.find(s=>s[0]===q.status)||['','New'])[1])}</span><small>${esc(fmtDT(q.createdAt))} · ${replies.length?`Last reply ${esc(fmtDT(replies[replies.length-1].at))}`:'Not replied yet'}${conv?' · Order '+esc(q.orderNo):''}</small></summary>
    <div class="ob"><div>
      <p class="iqmsg">${esc(q.message)}</p>
      ${q.budget||q.neededBy?`<p class="msg">${q.budget?'Budget: <b>'+esc(q.budget)+'</b>':''}${q.budget&&q.neededBy?' · ':''}${q.neededBy?'Needed by: <b>'+esc(q.neededBy)+'</b>':''}</p>`:''}
      <div class="iqopts">${q.options.map(o=>`<figure>${o.image?`<a href="${esc(o.image)}" target="_blank" rel="noopener"><img src="${esc(o.image)}" alt="${esc(o.label)} inspiration photo" loading="lazy"></a>`:'<div class="noimg">No photo</div>'}<figcaption><b>${esc(o.label)}</b>${o.note?'<br>'+esc(o.note):''}</figcaption></figure>`).join('')||'<p class="msg">No photos attached.</p>'}</div>
      <h4 class="sub4">Replies to customer</h4>
      ${replies.length?`<ol class="thread">${replies.map(r=>`<li><small>${esc(fmtDT(r.at))}${r.emailSent?' · emailed':''}</small><p>${esc(r.message)}</p>${r.price!=null?`<b>Quoted ${aed(r.price)}</b>`:''}${r.readyBy?` <span class="msg">· ready by ${esc(r.readyBy)}</span>`:''}</li>`).join('')}</ol>`:'<p class="msg">You haven\'t replied yet.</p>'}
    </div>
    <div class="cust"><b>${esc(q.customer.name)}</b><br><a href="mailto:${esc(q.customer.email)}">${esc(q.customer.email)}</a><br>WhatsApp ${esc(q.customer.whatsapp)}${q.suggestedAddress?`<br><span>${esc(q.suggestedAddress)}</span>`:''}
      ${conv?`<div class="convok">Converted to order <b>${esc(q.orderNo)}</b>. You'll find it on the Orders page.<br><a href="#ord-${esc(q.orderId)}" class="mini" data-goorder="${esc(q.orderId)}" style="margin-top:6px">View order</a></div>`:`
      <form class="replyf" data-reply="${esc(q.id)}" novalidate>
        <label><span>Reply to ${esc(first)}</span><textarea name="message" maxlength="1500" required>${esc(`Hi ${first}, thank you for your custom inquiry! `)}</textarea></label>
        <div class="row2"><label><span>Quoted price (${esc(curUser.currency||'AED')}, optional)</span><input name="price" type="number" min="0" step="0.5" inputmode="decimal" value="${q.quote?q.quote.price:''}"></label><label><span>Ready by (optional)</span><input name="readyBy" type="date" value="${q.quote?.readyBy||''}"></label></div>
        <button class="btn plumb" type="submit" style="width:100%">Send reply</button>
        <p class="msg" style="margin:6px 0 0">Emailed to the customer, and WhatsApp opens with your reply ready to send. The status changes to Replied, or Quoted when you add a price.</p>
      </form>
      <div class="nbox" id="qn-${esc(q.id)}"></div>
      <label style="margin-top:12px"><span>Status</span><select data-q="${esc(q.id)}">${IST.filter(([k])=>k!=='converted').map(([k,t])=>`<option value="${k}"${k===q.status?' selected':''}>${t}</option>`).join('')}</select></label>
      <details class="convert"${q.status==='accepted'?' open':''}><summary class="btn gold" style="width:100%">Convert to order</summary>
        <form class="convf" data-convert="${esc(q.id)}" novalidate>
          <p class="msg">Use this once ${esc(first)} has confirmed the agreed item and price. It creates a confirmed order, moves it to Orders, and sends the confirmation with a tracking link.</p>
          <label><span>Item</span><input name="name" maxlength="120" value="${esc('Custom order: '+q.message.slice(0,80))}"></label>
          <div class="row2"><label><span>Qty</span><input name="qty" type="number" min="1" max="99" step="1" value="1"></label><label><span>Price each (${esc(curUser.currency||'AED')})</span><input name="unitPrice" type="number" min="0" step="0.5" inputmode="decimal" value="${q.quote?q.quote.price:''}"></label></div>
          <label><span>Delivery address</span><textarea name="address" maxlength="400" placeholder="Building, street, area, city, emirate">${esc(q.suggestedAddress||'')}</textarea>${q.suggestedAddress?`<small class="hint2">${q.addressFrom==='inquiry'?'From the customer’s inquiry':'From the customer’s previous order '+esc(q.addressFrom)} — edit if needed</small>`:'<small class="hint2">No address on file for this customer — ask them and type it here</small>'}</label>
          <label><span>Order notes (optional)</span><textarea name="notes" maxlength="800">${esc([q.options.map(o=>o.note&&o.label+': '+o.note).filter(Boolean).join('; '),q.neededBy?'Needed by '+q.neededBy:''].filter(Boolean).join(' · '))}</textarea></label>
          <div class="err" role="alert"></div>
          <button class="btn plumb" type="submit" style="width:100%">Create confirmed order</button>
        </form>
      </details>`}
      <button class="mini" type="button" data-qdel="${esc(q.id)}" style="color:#b02a5a;margin-top:10px">Delete inquiry</button></div></div></details>`}).join('');
  for(const d of $('inquiries').querySelectorAll('details.ord'))d.addEventListener('toggle',()=>{d.open?iqOpen.add(d.dataset.qid):iqOpen.delete(d.dataset.qid)});
  $('inquiries').onchange=async e=>{const sel=e.target.closest('select[data-q]');if(!sel)return;sel.disabled=true;
    const r=await api('/api/inquiries?id='+encodeURIComponent(sel.dataset.q),{method:'PUT',body:JSON.stringify({status:sel.value})}).catch(()=>({ok:false,data:{}}));
    if(r.ok)loadInquiries();else{sel.disabled=false;alertMsg(r.data.error||'Could not update the inquiry.')}};
  $('inquiries').onclick=async e=>{
    const g=e.target.closest('[data-goorder]');if(g){e.preventDefault();openOrderId=g.dataset.goorder;location.hash='#orders';return}
    const b=e.target.closest('[data-qdel]');if(!b)return;
    if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent='Tap again to delete';setTimeout(()=>{b.dataset.confirm='';b.textContent='Delete inquiry'},3000);return}
    b.disabled=true;const r=await api('/api/inquiries?id='+encodeURIComponent(b.dataset.qdel),{method:'DELETE'}).catch(()=>({ok:false,data:{}}));
    if(r.ok)loadInquiries();else{b.disabled=false;alertMsg('Could not delete the inquiry.')}};
  $('inquiries').onsubmit=async e=>{
    const f=e.target;e.preventDefault();
    if(f.dataset.reply){
      const id=f.dataset.reply,btn=f.querySelector('button[type=submit]');
      const d={message:f.message.value.trim(),price:f.price.value,readyBy:f.readyBy.value};
      if(d.message.length<2){f.message.focus();return}
      const w=window.open('about:blank','_blank');btn.disabled=true;btn.textContent='Sending…';
      const r=await api('/api/inquiries?id='+encodeURIComponent(id)+'&action=reply',{method:'POST',body:JSON.stringify(d)}).catch(()=>({ok:false,data:{}}));
      if(!r.ok){if(w)w.close();btn.disabled=false;btn.textContent='Send reply';const nb=$('qn-'+id);if(nb)nb.innerHTML=`<p class="nerr">${esc(r.data.error||'Could not send the reply.')}</p>`;return}
      iqOpen.add(id);renderInquiries(r.data.inquiries);loadInquiries().then(()=>showReplyNote(id,{...r.data.notification,auto:!!w}));
      const n=r.data.notification;if(w){if(n.whatsappUrl)w.location.href=n.whatsappUrl;else w.close()}
      showReplyNote(id,{...n,auto:!!w});
    }
    if(f.dataset.convert){
      const id=f.dataset.convert,btn=f.querySelector('button[type=submit]'),er=f.querySelector('.err');
      const d={items:[{name:f.name.value.trim(),qty:+f.qty.value||1,unitPrice:+f.unitPrice.value}],address:f.address.value.trim(),notes:f.notes.value.trim()};
      if(!d.items[0].name){f.name.focus();return er.textContent='Describe the item.'}
      if(!(d.items[0].unitPrice>0)){f.unitPrice.focus();return er.textContent='Enter the agreed price.'}
      if(d.address.length<8){f.address.focus();return er.textContent='Enter the delivery address.'}
      const w=window.open('about:blank','_blank');btn.disabled=true;btn.textContent='Creating order…';
      const r=await api('/api/inquiries?id='+encodeURIComponent(id)+'&action=convert',{method:'POST',body:JSON.stringify(d)}).catch(()=>({ok:false,data:{}}));
      if(!r.ok){if(w)w.close();btn.disabled=false;btn.textContent='Create confirmed order';er.textContent=r.data.error||'Could not create the order.';return}
      const o=r.data.order,n=r.data.notification;
      loadInquiries();
      notes.set(o.id,{...n,auto:!!w});renderOrders(r.data.orders);
      if(w){if(n&&n.whatsappUrl)w.location.href=n.whatsappUrl;else w.close()}
      openOrderId=o.id;location.hash='#orders';
    }
  };
}
function showReplyNote(id,n){
  const box=$('qn-'+id);if(!box)return;
  box.innerHTML=`<div class="note-ok"><b>Reply sent</b>
    <div class="nrow"><span class="${n.emailSent?'ok':'warn'}">${n.emailSent?'✓ Emailed to customer':'Email not sent automatically'}</span>${n.mailtoUrl?`<a class="mini" href="${esc(n.mailtoUrl)}">Send email</a>`:''}</div>
    <div class="nrow"><span class="ok">${n.whatsappUrl?(n.auto?'✓ WhatsApp opened with your reply':'WhatsApp reply ready'):'No customer WhatsApp number'}</span>${n.whatsappUrl?`<a class="mini wa" href="${esc(n.whatsappUrl)}" target="_blank" rel="noopener">Open WhatsApp</a>`:''}</div></div>`;
}
function alertMsg(m){const p=$('pmsg');if(p)p.textContent=m}
$('logout').addEventListener('click',async()=>{await api('/api/logout',{method:'POST'}).catch(()=>{});showLogin('You have logged out.')});

(async()=>{
  const welcome=new URLSearchParams(location.search).has('welcome');
  if(welcome)history.replaceState(null,'','/account.html');
  try{const r=await api('/api/me');if(r.ok)showAccount(r.data.user,welcome);else showLogin()}
  catch{showLogin()}
})();
}
</script>
</body>
</html>
