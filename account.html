<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#4a1d4f">
<title>My account — Craftifix</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
--bg:light-dark(#fff7fa,#1b0f1c);--ink:light-dark(#2a1430,#f6e8f1);--mute:light-dark(#6d5670,#c6aec4);
--plum:#4a1d4f;--blush:light-dark(#ffe3ec,#3a2040);--pink:#f48fb1;--gold:#ffb627;
--line:light-dark(#ecd9e4,#3d2742);--panel:light-dark(#ffffff,#2a182e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.6 "Nunito Sans",system-ui,sans-serif;overflow-x:clip;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{font-family:Outfit,system-ui,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
a{color:inherit}
.bar{background:var(--plum);color:#fff}
.bar .in{display:flex;align-items:center;gap:14px;padding:10px max(5vw,16px);max-width:1240px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;font:800 21px Outfit,sans-serif;text-decoration:none;color:#fff}
.bar .who{margin-left:auto;font-size:14.5px;color:#f6c8da;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border-radius:999px;font:700 15.5px Outfit,sans-serif;text-decoration:none;border:2px solid transparent;cursor:pointer}
.btn[disabled]{opacity:.6;cursor:wait}
.gold{background:var(--gold);color:#2a1430}.plumb{background:var(--plum);color:#fff}
.ghost{background:none;border-color:currentColor;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{flex:1;width:100%;max-width:1240px;margin:0 auto;padding:clamp(24px,4vw,56px) max(5vw,16px)}
.center{display:grid;place-items:center;min-height:60vh}
.box{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,3vw,34px);width:min(440px,100%);box-shadow:0 20px 40px rgba(74,29,79,.1)}
.box h1{font-size:32px;margin-bottom:6px}
.box p{color:var(--mute);margin:0 0 18px}
label{display:block;font-weight:700;font-size:14.5px;margin-bottom:12px}
label span{display:block;margin-bottom:5px}
input,textarea,select{width:100%;font:16px "Nunito Sans",sans-serif;min-height:46px;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink)}
input:focus,textarea:focus{border-color:var(--plum);outline:none;box-shadow:0 0 0 3px rgba(244,143,177,.45)}
.err{color:#c62f5f;font-size:14px;min-height:20px;margin:-4px 0 8px}
.box .btn{width:100%}
.small{text-align:center;font-size:14.5px;color:var(--mute);margin-top:14px}
.small a{color:var(--ink);font-weight:700}
.welcome{background:var(--plum);color:#fff;border-radius:22px;padding:clamp(22px,3vw,34px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.welcome h1{font-size:clamp(28px,4vw,42px)}
.welcome p{margin:8px 0 0;color:#f6d3e2}
.badge{display:inline-block;background:var(--gold);color:#2a1430;font:700 14px Outfit,sans-serif;padding:5px 14px;border-radius:999px;white-space:nowrap}
.ribbon{background:#cdeedd;color:#155c3b;border-radius:14px;padding:12px 16px;margin:0 0 18px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
.card h3{font-size:19px;margin-bottom:12px}
.kv div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.kv div:first-child{border-top:0}
.kv b{text-align:right;overflow-wrap:anywhere}
.meter{height:10px;border-radius:999px;background:var(--blush);overflow:hidden;margin:4px 0 12px}
.meter span{display:block;height:100%;background:var(--pink)}
.use{font-size:14.5px;display:flex;justify-content:space-between;gap:8px}
.use.full b{color:#b02a5a}
.fxn{font-size:12.5px;margin-top:10px}.fxn a{color:inherit}
.billbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#fff5f8;border:1.5px solid #e7a1bd;border-radius:16px;padding:12px 16px;margin:0 0 16px;font-size:14.5px}
.billbar b{color:#b02a5a}.billbar .btn{white-space:nowrap}
.billbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.box .ok{background:#e9f7f0;border:1.5px solid #bfe5d2;color:#165a3c;border-radius:12px;padding:10px 12px;font-size:14px;margin:4px 0 10px}
.invrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#f3ecfb;border-radius:12px;padding:8px 10px;margin-top:10px;font-size:14px}.invrow span{margin-right:auto}
.shipgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.modes{display:grid;gap:10px;margin-bottom:14px}
.mode{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer}
.mode input{width:auto;min-height:0;margin-top:4px}.mode b{display:block}.mode small{color:var(--mute)}
.mode:has(input:checked){border-color:var(--plum);background:#faf3fb}
.sbox{border-left:4px solid var(--pink);padding:4px 0 4px 14px;margin:0 0 12px}
.row3s{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.unit2{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.unit2 span{padding:0 10px;font-weight:700;font-size:13px;color:var(--mute)}.unit2 input{border:0;border-radius:0;min-height:44px;padding-left:4px}
.regrow,.reghead{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) 30px;gap:8px;margin-bottom:8px;align-items:center}
.reghead span{font-size:12.5px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.mdel2{border:0;background:none;color:var(--mute);font-size:22px;cursor:pointer;padding:4px 6px}.mdel2:hover{color:#b02a5a}
.madd2{border:1.5px dashed var(--line);background:none;border-radius:999px;padding:7px 14px;font:700 14px inherit;color:var(--ink);cursor:pointer}
.sep2{height:1px;background:var(--line);margin:16px 0}
.checkrow{display:flex;gap:10px;align-items:flex-start;margin:12px 0}.checkrow input{width:auto;min-height:0;margin-top:4px}.checkrow small{display:block;color:var(--mute)}
.warnbox{background:#fff4dc;border-radius:12px;padding:10px 12px;font-size:14px;color:#6b4300}
.prevbox{background:#faf3fb;border-radius:14px;padding:10px 14px;font-size:14.5px}.prevbox p{margin:6px 0}
.maplink{font-size:13.5px;font-weight:700;color:var(--plum)}
@media(max-width:820px){.shipgrid{grid-template-columns:minmax(0,1fr)}.row3s{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.shipf{margin-top:10px;border:1.5px solid var(--plum);border-radius:14px;padding:12px;display:grid;gap:8px;background:#faf3fb}
.shipf>small{color:var(--mute);margin-top:-6px}.shipf .row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.payinfo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff4e8;border-radius:12px;padding:8px 10px;margin-top:10px;font-size:14px}.payinfo.ok{background:#e9f7ef}.payinfo span{margin-right:auto}
.payf [data-pm]{display:grid;gap:8px}.payf [data-pm]>small{color:var(--mute);margin-top:-6px}.payf [data-pm][hidden]{display:none}
.payf textarea{width:100%;min-height:84px;font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);color:var(--ink)}
.shipinfo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#eef4ff;border-radius:12px;padding:8px 10px;margin-top:10px;font-size:14px}.shipinfo span{margin-right:auto}.shipinfo a{font-weight:700;color:var(--plum)}
.plim{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.limbar{border:1.5px solid #f0d2df;background:#fff;border-radius:18px;padding:14px 16px;margin:0 0 16px}
.limbar.ok{background:#e9f7f0;border-color:#bfe5d2;color:#165a3c;font-size:14.5px}
.limbar.full{border-color:#e7a1bd;background:#fff5f8}
.limhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.limhead b{display:block;font:700 16px Outfit,sans-serif}.limhead span{display:block;color:var(--mute);font-size:13.5px;max-width:560px}
.limhead .btn{white-space:nowrap}
.limrows{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 18px;margin-top:12px}
.limrow{display:grid;grid-template-columns:1fr auto;font-size:14px;align-items:baseline}
.limrow .meter{grid-column:1/-1;margin:4px 0 2px}.limrow small{grid-column:1/-1;color:var(--mute);font-size:12.5px}
.limrow.near .meter span{background:#ffb627}.limrow.full .meter span{background:#c62f5f}.limrow.full b,.limrow.full small{color:#b02a5a;font-weight:700}
.locked{margin-top:12px;border:1.5px dashed #e7a1bd;background:#fff5f8;border-radius:14px;padding:12px;font-size:14px}
.locked b{display:block;color:#b02a5a;margin-bottom:4px}
.plans{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.pl{border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 10px}
.pl>b{grid-column:1}.pl>small{grid-column:1}.pl>.btn,.pl>.badge{grid-column:2;grid-row:1/3}
.pl.cur{border-color:var(--plum);background:var(--blush)}
.pl b{font:700 17px Outfit,sans-serif}.pl small{color:var(--mute)}
.pl .btn{min-height:40px;font-size:14px;padding:0 16px}
.msg{min-height:22px;font-size:14px;margin-top:10px;color:var(--mute)}
.wide{grid-column:span 2}
.planpill{display:inline-flex;align-items:center;gap:6px;flex:none;background:#ffb627;color:#2a1430;font:700 13px Outfit,sans-serif;padding:5px 11px;border-radius:999px;text-decoration:none;white-space:nowrap}
.planpill i{width:8px;height:8px;border-radius:50%;background:#2f9e6b;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.planpill:hover{filter:brightness(1.05)}
@media(max-width:640px){.planpill .pst{display:none}}
.mylogo{width:40px;height:40px;border-radius:50%;object-fit:cover;vertical-align:middle;border:1px solid var(--line)}
.soclinks a{color:var(--plum);text-decoration:underline}
.logoup{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;margin-bottom:12px}
.logobox{width:72px;height:72px;margin:0!important;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;cursor:pointer;overflow:hidden;background:var(--bg);text-align:center;font-size:11.5px;color:var(--mute);font-weight:700}
.logobox img{width:100%;height:100%;object-fit:cover}
.linkbtn{background:none;border:0;color:#b02a5a;font-weight:700;cursor:pointer;padding:4px 0;font-size:13.5px}
.wnav{display:flex;gap:2px;overflow-x:auto}
.wnav a{color:#fff;font-weight:700;text-decoration:none;padding:9px 12px;border-radius:999px;white-space:nowrap;font-size:14.5px}
.wnav a:hover{background:rgba(255,255,255,.12)}.wnav a.on{background:rgba(255,255,255,.2)}
.ofilter{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 6px}
.ofilter button,.anahead .seg button{min-height:36px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:700 13px "Nunito Sans",sans-serif;cursor:pointer}
.ofilter button[aria-pressed=true],.anahead .seg button[aria-pressed=true]{background:var(--plum);border-color:var(--plum);color:#fff}
.ana{margin-top:18px}
.anahead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.anahead h2{font-size:24px}.anahead .seg{display:flex;gap:6px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:2px}
.kpi:hover{border-color:var(--plum)}
.kpi small{color:var(--mute);font-weight:600;font-size:13px}
.kpi b{font:800 clamp(22px,2.4vw,28px)/1.1 Outfit,sans-serif;white-space:nowrap}
.kpi span{font-size:13px;color:var(--mute)}.kpi em{font-style:normal;color:#b02a5a;font-weight:700}
.agrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px;align-items:start}
.agrid .wide2{grid-column:span 2}
.bars{display:flex;align-items:flex-end;gap:3px;height:200px;padding-top:8px;border-bottom:1px solid var(--line)}
.bcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;min-width:0}
.bv{background:linear-gradient(#f48fb1,#d9669a);border-radius:5px 5px 0 0}
.bcol small{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--mute);white-space:nowrap}
.bars{margin-bottom:24px}
.hrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.hrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hrow b{font-variant-numeric:tabular-nums;white-space:nowrap}
.hb{height:10px;background:var(--blush);border-radius:999px;overflow:hidden}.hb i{display:block;height:100%;background:#d9669a;border-radius:999px}
.hb .c-new{background:#ffb627}.hb .c-confirmed{background:#8b7be0}.hb .c-payment_requested{background:#e07a2f}.hb .c-payment_done{background:#3fae8c}.hb .c-in_production{background:#e0a100}.hb .c-ready{background:#4a90d9}.hb .c-shipped{background:#2a7fb8}.hb .c-completed{background:#2f9e6b}.hb .c-cancelled{background:#b8a9b6}.hb .c-inq{background:#4a1d4f}
.trow{margin:10px 0 12px}.trow .tn{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:5px}.trow .tn b{white-space:nowrap}.trow small{display:block;margin-top:3px;font-size:12.5px}
.act{list-style:none;padding:0;margin:0}.act li{padding:8px 0;border-top:1px solid var(--line);font-size:14px}.act li:first-child{border-top:0}
.act a{text-decoration:none}.act a:hover{text-decoration:underline}.act small{display:block;color:var(--mute)}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.agrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.agrid{grid-template-columns:minmax(0,1fr)}.agrid .wide2{grid-column:auto}.bars{height:160px}}
.sethead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:6px}
.sethead h1{font-size:clamp(28px,3.6vw,40px)}.sethead p{margin:6px 0 0;color:var(--mute)}
@media(max-width:640px){.bar .in{flex-wrap:wrap;row-gap:4px}.bar .who{display:none}#logout{margin-left:auto;min-height:36px!important;padding:0 14px;font-size:14px}.planpill{font-size:12px;padding:4px 9px}.bar .logo{font-size:18px;gap:8px}.bar .in{gap:8px}.wnav{order:3;width:100%;justify-content:space-between;gap:2px;scrollbar-width:none}.wnav a{padding:7px 8px;font-size:13.5px}}
#logout{white-space:nowrap}
@media(max-width:420px){.bar .logo{font-size:0!important;gap:0!important}}
.loading{color:var(--mute);text-align:center;padding:60px 0}
.mini{font:700 13px "Nunito Sans",sans-serif;border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:34px}
.full{grid-column:1/-1}
.sub4{font:700 15px Outfit,sans-serif;margin:14px 0 6px}
.thread{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.thread li{background:var(--blush);border-radius:12px;padding:8px 12px;font-size:14.5px}
.thread p{margin:2px 0;white-space:pre-wrap}.thread small{color:var(--mute)}
.replyf textarea{min-height:90px;resize:vertical}
.convf textarea{min-height:64px;resize:vertical}
.replyf .row2,.convf .row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.convert{margin-top:12px}.convert>summary{list-style:none;cursor:pointer}.convert>summary::-webkit-details-marker{display:none}
.convf{margin-top:10px;border:1.5px solid var(--gold);border-radius:14px;padding:12px}
.hint2{display:block;font-weight:400;font-size:12.5px;color:var(--mute);margin-top:4px}
.convok{margin-top:10px;background:#cdeedd;color:#155c3b;border-radius:12px;padding:10px 12px}
.srctag{font-size:12px;font-weight:700;background:#e2dcfb;color:#3b2a8a;border-radius:999px;padding:1px 8px;white-space:nowrap}
.flash{animation:fl 2s ease-out}@keyframes fl{0%{box-shadow:0 0 0 4px var(--gold)}100%{box-shadow:none}}
.st-in_production{background:#ffe7b0;color:#6b4300}
.iqmsg{white-space:pre-wrap;margin:10px 0 6px;font-size:15px}
.iqopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}
.iqopts figure{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.iqopts img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.iqopts .noimg{aspect-ratio:1;display:grid;place-items:center;color:var(--mute);background:var(--blush);font-size:13px}
.iqopts figcaption{padding:8px 10px;font-size:13.5px}
.alertsetup{background:#f0fbf4;border-color:#bfe8cf}.alertsetup ol{margin:8px 0;padding-left:20px;line-height:1.7}.alertsetup p{margin:6px 0}
.pill{font:700 13px "Nunito Sans",sans-serif;color:var(--mute)}
.ord{border:1px solid var(--line);border-radius:14px;margin-top:10px;overflow:hidden}
.ord summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto auto;gap:6px 14px;align-items:center;padding:12px 14px}
.ord summary::-webkit-details-marker{display:none}
.ord summary small{grid-column:1/-1;color:var(--mute);margin-top:-4px}
.ord summary span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ob{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding:4px 14px 14px;border-top:1px solid var(--line)}
.cust{font-size:14.5px;line-height:1.6;padding-top:8px}
.cust select{width:100%;min-height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:15px "Nunito Sans",sans-serif;padding:0 10px}
.note-ok{margin-top:10px;background:var(--blush);border-radius:12px;padding:10px 12px;font-size:14px}
.nrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;margin-top:6px}
.nrow .ok{color:#2f9e6b;font-weight:700}.nrow .warn{color:#8a5a00;font-weight:700}
.mini.wa{background:#25d366;border-color:#25d366;color:#0b3d1f;text-decoration:none}
a.mini{text-decoration:none;display:inline-flex;align-items:center}
.nerr{color:#c62f5f;font-size:14px;margin:8px 0 0}
.msgprev{margin-top:6px}.msgprev summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--mute)}
.msgprev pre{white-space:pre-wrap;font:13.5px/1.5 "Nunito Sans",sans-serif;background:var(--panel);border-radius:10px;padding:10px;margin:6px 0 0}
.hist{font-size:12.5px;color:var(--mute);margin:8px 0 0}
.st{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--blush)}
.st-new{background:#ffe7b0;color:#6b4300}.st-confirmed,.st-in_production,.st-ready{background:#e2dcfb;color:#3b2a8a}.st-shipped{background:#d8ecfb;color:#13507a}.st-payment_requested{background:#ffe0c7;color:#7a3a00}.st-payment_done{background:#d3f2e6;color:#155c3b}.st-completed{background:#cdeedd;color:#155c3b}.st-cancelled{background:#eee3e9;color:#6d5670}

<body>
<header class="bar"><div class="in">
  <a class="logo" href="/" aria-label="Craftifix home">
    <img src="/favicon.svg" width="30" height="30" alt="" aria-hidden="true">
    Craftifix
  </a>
  <span class="who" id="who"></span>
  <a class="planpill" id="planPill" href="/account.html#settings" hidden title="Your plan — open Settings"></a>
  <nav id="wnav" class="wnav" hidden aria-label="Workspace"><a href="/account.html" data-v="dashboard">Dashboard</a><a href="/account.html#orders" data-v="orders">Orders</a><a href="/account.html#inquiries" data-v="inquiries">Inquiries</a><a href="/products.html" data-v="products">My products</a><a href="/account.html#shipping" data-v="shipping">Shipping</a><a href="/account.html#settings" data-v="settings">Settings</a></nav>
  <button class="btn ghost" id="logout" type="button" hidden style="min-height:40px;color:#fff">Log out</button>
</div></header>

<main id="main"><div class="loading">Loading your account…</div></main>

<footer>© 2026 Craftifix · <a href="/">Back to website</a></footer>

<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const main=$('main');
const ALL=[['standard','Standard',5,'Up to 5 product listings · 5 orders from inquiries a month'],['premium','Premium',15,'Unlimited product listings · unlimited orders from inquiries']];
const FEAT=[['dashboard','Dashboard'],['pricingCalculator','Pricing calculator'],['onlineStore','Online store'],['customers','Customer management'],['inventory','Inventory'],['salesReports','Sales reports'],['productionTracking','Production tracking'],['staffAccounts','Staff accounts']];
const lim=v=>v===null?'Unlimited':v===0?'Not included':String(v);
const planLabel=(u,id)=>u&&u.pricing&&u.pricing.plans[id]?u.pricing.plans[id].label:'USD '+(ALL.find(x=>x[0]===id)||[0,0,0])[2];
function fxNote(u){const pr=u&&u.pricing;if(!pr||pr.currency==='USD')return'';
  const upd=pr.updated?new Date(pr.updated).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
  return `<p class="msg fxn">Plan prices are set in US dollars (Standard USD 5, Premium USD 15) and shown in ${esc(pr.currency)} at ${pr.live?'today’s':'an approximate'} exchange rate: 1 USD = ${pr.rate} ${esc(pr.currency)}${upd?` (updated ${upd})`:''}. The amount follows the rate each month. <a href="${esc(pr.sourceUrl)}" target="_blank" rel="noopener">Rates by Exchange Rate API</a></p>`}
let billingInfo=null;
const SUBLBL={trial:['Free trial','#2f9e6b'],trial_ended:['Free trial ended','#c62f5f'],active:['Active','#2f9e6b'],pending:['Payment needed','#c62f5f'],past_due:['Payment failed','#c62f5f'],unpaid:['Unpaid','#c62f5f'],canceled:['Cancelled','#c62f5f']};
const subLbl=u=>SUBLBL[u.subscription?.status||'active']||[String(u.subscription?.status||'Active'),'#c62f5f'];
const longDay=d=>new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
function payRow(u){const s=u.subscription||{};
  if(s.provider!=='stripe')return s.paymentStatus==='skipped'?'Skipped (early account)':'—';
  if(s.status==='trial')return u.trial?`No card needed yet · trial ends ${longDay(u.trial.endsAt)}`:'Free trial';
  if(s.status==='trial_ended')return 'Add billing details to reopen your shop';
  if(s.status==='active'&&s.paymentStatus==='card-added'&&s.trialEndsAt&&new Date(s.trialEndsAt)>new Date())return `Card added · first charge ${longDay(s.trialEndsAt)}`;
  if(s.status==='active')return s.paidUntil?`Card via Stripe · ${s.cancelAtPeriodEnd?'ends':'renews'} ${longDay(s.paidUntil)}`:'Card via Stripe';
  if(s.status==='pending')return 'Not paid yet';
  if(s.status==='past_due')return 'Last payment failed — Stripe will retry';
  return 'Subscription ended';}
/* Banner when the subscription needs attention — the shop is closed to customers until it's paid. */
function billingBanner(u){const s=u.subscription||{};if(!billingInfo||!billingInfo.online)return'';
  if(s.status==='trial'&&u.trial&&!u.trial.ended){const d=u.trial.daysLeft,soon=d<=7;
    return `<div class="billbar"${soon?'':' style="background:#e9f7ef;color:#1d5c3c"'}><span><b>Free trial: ${d} day${d===1?'':'s'} left</b> (until ${longDay(u.trial.endsAt)}). Your shop is open and everything on the ${esc(u.planDetails.name)} plan is unlocked. ${soon?`Add your billing details before ${longDay(u.trial.endsAt)} to keep your shop open — you won't be charged until the trial ends.`:`No card needed yet — you'll be asked for billing details when the trial ends. It's ${planLabel(u,u.plan)}/month after that.`}</span><button class="btn ${soon?'gold':'plumb'}" type="button" data-bill="checkout">Add billing details</button></div>`}
  const msg={trial_ended:`<b>Your 30-day free trial has ended, so your shop is closed to customers.</b> Add your billing details to reopen it — your products, orders and settings are all still here. ${esc(u.planDetails.name)} plan: ${planLabel(u,u.plan)}/month.`,pending:`<b>Complete your payment to open your shop.</b> Your ${esc(u.planDetails.name)} plan is ${planLabel(u,u.plan)}/month. Customers can't see your shop until it's paid — you can set up products in the meantime.`,
    past_due:`<b>Your last payment didn't go through.</b> Stripe will try again. Update your card to keep your shop open.`,
    unpaid:`<b>Your subscription is unpaid, so your shop is closed to customers.</b> Pay to reopen it.`,
    canceled:`<b>Your subscription has ended, so your shop is closed to customers.</b> Subscribe again to reopen it.`}[s.status];
  if(!msg)return'';
  const btn=s.status==='past_due'&&u.stripe?.customerId?`<button class="btn gold" type="button" data-bill="portal">Update card</button>`:s.status==='trial_ended'?`<button class="btn gold" type="button" data-bill="checkout">Add billing details</button>`:`<button class="btn gold" type="button" data-bill="checkout">Pay ${planLabel(u,u.plan)}/mo</button>`;
  return `<div class="billbar"><span>${msg}</span>${btn}</div>`}
async function goBilling(kind,btn){if(btn){btn.disabled=true;btn.textContent='Opening Stripe…'}
  const r=await api('/api/billing?action='+kind,{method:'POST',body:JSON.stringify({plan:curUser&&curUser.plan})}).catch(()=>({ok:false,data:{}}));
  if(r.ok&&r.data.url){location.href=r.data.url;return}
  const m=r.data.error||'Could not open the payment page.';if(btn){btn.disabled=false;btn.textContent='Try again';const box=btn.closest('.billbar,.card');if(box){let e=box.querySelector('.billerr');if(!e){e=document.createElement('p');e.className='billerr';e.style.cssText='color:#b02a5a;font-size:13.5px;margin:8px 0 0;width:100%';box.appendChild(e)}e.textContent=m;return}}alertMsg(m)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-bill]');if(b){e.preventDefault();goBilling(b.dataset.bill,b)}});
const fmtDay=d=>new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
/* Plan limits banner — keeps Standard owners informed about what they have left. */
function limitBanner(u,which){
  const us=u.usage;if(!us)return'';
  if(us.products.limit===null)return which==='dash'?`<div class="limbar ok"><b>Premium plan</b> — unlimited product listings and unlimited orders from inquiries.</div>`:'';
  const P=us.products,Q=us.inquiryOrders;
  const row=(label,x,extra)=>{const full=x.used>=x.limit,near=!full&&x.used>=x.limit-1;
    return `<div class="limrow ${full?'full':near?'near':''}"><span>${label}</span><b>${x.used} of ${x.limit}</b><div class="meter"><span style="width:${Math.min(100,x.used/x.limit*100)}%"></span></div><small>${full?'Limit reached':`${x.limit-x.used} left`}${extra||''}</small></div>`};
  const rows=[];
  if(which!=='inquiries')rows.push(row('Product listings',P));
  if(which!=='products')rows.push(row('Orders from inquiries this month',Q,` · resets ${fmtDay(Q.resetsOn)}`));
  const anyFull=P.used>=P.limit||Q.used>=Q.limit;
  return `<div class="limbar${anyFull?' full':''}"><div class="limhead"><div><b>Standard plan limits</b><span>Up to ${P.limit} product listings and ${Q.limit} confirmed orders from inquiries each month. Orders placed directly from your shop are not limited.</span></div><a class="btn gold" href="/account.html#settings">Upgrade to Premium · ${planLabel(u,'premium')}/mo</a></div><div class="limrows">${rows.join('')}</div></div>`;
}

async function api(path,opts={}){
  const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opts});
  const j=await r.json().catch(()=>({}));return{ok:r.ok,status:r.status,data:j};
}

function showLogin(note){
  brandIcon(null);
  $('who').textContent='';$('logout').hidden=true;$('wnav').hidden=true;$('planPill').hidden=true;
  main.innerHTML=`<div class="center"><form class="box" id="lf" novalidate>
    <h1>Log in</h1><p>Welcome back to your Craftifix workspace.</p>
    ${note?`<div class="ribbon">${esc(note)}</div>`:''}
    <label><span>User ID</span><input id="lu" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label><span>Password</span><input id="lp" type="password" autocomplete="current-password" required></label>
    <p class="small" style="text-align:right;margin:-6px 0 0"><a href="#" id="forgotLink">Forgot password?</a></p>
    <div class="err" id="lerr" role="alert"></div>
    <button class="btn plumb" id="lbtn" type="submit">Log in</button>
    <p class="small">New to Craftifix? <a href="/#join">Create an account</a></p>
  </form></div>`;
  $('lu').focus();
  $('forgotLink').addEventListener('click',e=>{e.preventDefault();showForgot($('lu').value.trim())});
  $('lf').addEventListener('submit',async e=>{e.preventDefault();
    const userId=$('lu').value.trim(),password=$('lp').value;
    if(!userId||!password){$('lerr').textContent='Please enter your user ID and password.';return}
    const b=$('lbtn');b.disabled=true;b.textContent='Logging in…';
    try{const r=await api('/api/login',{method:'POST',body:JSON.stringify({userId,password})});
      if(!r.ok){$('lerr').textContent=r.data.error||'Could not log in.';return}
      const m=await api('/api/me');billingInfo=m.data.billing||null;showAccount(m.ok?m.data.user:r.data.user,false)}
    catch{$('lerr').textContent='Network problem — please try again.'}
    finally{b.disabled=false;b.textContent='Log in'}
  });
}

/* Forgot password: email a reset link */
function showForgot(prefill){
  $('who').textContent='';$('logout').hidden=true;$('wnav').hidden=true;$('planPill').hidden=true;
  main.innerHTML=`<div class="center"><form class="box" id="ff" novalidate>
    <h1>Forgot password?</h1><p>Enter your user ID or the email on your account. We'll email you a link to set a new password.</p>
    <label><span>User ID or email</span><input id="fl" autocomplete="username" autocapitalize="none" spellcheck="false" required value="${esc(prefill||'')}"></label>
    <div class="err" id="ferr" role="alert"></div><div class="ok" id="fok" role="status" hidden></div>
    <button class="btn plumb" id="fbtn" type="submit">Send reset link</button>
    <p class="small"><a href="#" id="backLogin">← Back to log in</a></p>
  </form></div>`;
  $('fl').focus();
  $('backLogin').addEventListener('click',e=>{e.preventDefault();showLogin()});
  $('ff').addEventListener('submit',async e=>{e.preventDefault();
    const login=$('fl').value.trim();$('ferr').textContent='';
    if(!login){$('ferr').textContent='Enter your user ID or email.';return}
    const b=$('fbtn');b.disabled=true;b.textContent='Sending…';
    try{const r=await api('/api/forgot-password',{method:'POST',body:JSON.stringify({login})});
      if(!r.ok){$('ferr').textContent=r.data.error||'Something went wrong — please try again.';return}
      $('fok').hidden=false;$('fok').innerHTML=`<b>Check your email.</b> ${esc(r.data.message)} Don't see it? Check spam, or try again in 2 minutes.`;b.textContent='Send again'}
    catch{$('ferr').textContent='Network problem — please try again.'}
    finally{b.disabled=false;if(b.textContent==='Sending…')b.textContent='Send reset link'}
  });
}

/* Reset password from the emailed link (/account.html?reset=TOKEN) */
async function showReset(token){
  $('who').textContent='';$('logout').hidden=true;$('wnav').hidden=true;$('planPill').hidden=true;
  main.innerHTML='<div class="center"><div class="box"><p>Checking your link…</p></div></div>';
  const c=await api('/api/reset-password',{method:'POST',body:JSON.stringify({token,check:true})}).catch(()=>({ok:false,data:{}}));
  if(!c.ok){main.innerHTML=`<div class="center"><div class="box"><h1>Link expired</h1><p>${esc(c.data.error||'This reset link is no longer valid.')}</p><button class="btn plumb" id="again" type="button">Get a new link</button></div></div>`;$('again').addEventListener('click',()=>showForgot());return}
  main.innerHTML=`<div class="center"><form class="box" id="rf" novalidate>
    <h1>Set a new password</h1><p>For your account <b>${esc(c.data.userId)}</b>.</p>
    <input type="text" autocomplete="username" value="${esc(c.data.userId)}" hidden>
    <label><span>New password</span><input id="rp1" type="password" autocomplete="new-password" minlength="8" required></label>
    <label><span>Confirm new password</span><input id="rp2" type="password" autocomplete="new-password" required></label>
    <p class="small" style="margin:-4px 0 0">At least 8 characters, with a letter and a number.</p>
    <div class="err" id="rerr" role="alert"></div>
    <button class="btn plumb" id="rbtn" type="submit">Save new password</button>
  </form></div>`;
  $('rp1').focus();
  $('rf').addEventListener('submit',async e=>{e.preventDefault();
    const p1=$('rp1').value,p2=$('rp2').value;$('rerr').textContent='';
    if(p1.length<8||!/[a-zA-Z]/.test(p1)||!/[0-9]/.test(p1)){$('rerr').textContent='Use at least 8 characters, with a letter and a number.';return}
    if(p1!==p2){$('rerr').textContent='The two passwords don’t match.';return}
    const b=$('rbtn');b.disabled=true;b.textContent='Saving…';
    try{const r=await api('/api/reset-password',{method:'POST',body:JSON.stringify({token,password:p1})});
      if(!r.ok){$('rerr').textContent=r.data.error||'Could not save the password.';return}
      const m=await api('/api/me');if(!m.ok)return showLogin('Password changed — please log in.');
      billingInfo=m.data.billing||null;showAccount(m.data.user,false);
      main.insertAdjacentHTML('afterbegin','<div class="ribbon">Your password has been changed and you’re logged in.</div>')}
    catch{$('rerr').textContent='Network problem — please try again.'}
    finally{b.disabled=false;b.textContent='Save new password'}
  });
}

document.addEventListener('click',async e=>{const b=e.target.closest('[data-copyinv]');if(!b)return;
  try{await navigator.clipboard.writeText(b.dataset.copyinv);b.textContent='Copied ✓'}catch{prompt('Copy the invoice link:',b.dataset.copyinv)}setTimeout(()=>{b.textContent='Copy link'},2000)});
/* ---------- Shipping settings ---------- */
function showShipping(u){
  const cur=u.currency||'AED',m=n=>fmtMoney(n,cur);
  const sh=JSON.parse(JSON.stringify(u.shipping||{mode:'off',km:{base:0,perKm:0,maxKm:0},regions:[],freeOver:0,pickup:{enabled:false,note:''}}));
  sh.km.express=sh.km.express||{enabled:false,base:0,perKm:0};sh.speeds=sh.speeds||{standardEta:'2–3 days',expressEta:'Same day',expressNote:''};
  const addr=u.shopAddress||{};
  const regRow=(r,i)=>`<div class="regrow" data-i="${i}"><input data-r="name" maxlength="60" value="${esc(r.name)}" placeholder="Region or area, e.g. Dubai" aria-label="Region"><div class="unit2"><span>${esc(cur)}</span><input data-r="fee" type="number" min="0" step="any" inputmode="decimal" value="${r.fee??''}" placeholder="—" aria-label="Standard fee"></div><div class="unit2"><span>${esc(cur)}</span><input data-r="express" type="number" min="0" step="any" inputmode="decimal" value="${r.express??''}" placeholder="—" aria-label="Express fee"></div><button type="button" class="mdel2" data-rdel="${i}" aria-label="Remove">×</button></div>`;
  main.innerHTML=`
  <section class="sethead"><div><h1>Shipping</h1><p>Set how much delivery costs. The fee is added to the customer's cart and total, and shows on the order, emails and invoice.</p></div><a class="mini" href="/account.html">← Back to dashboard</a></section>
  <div class="shipgrid">
  <form class="card" id="shipForm" novalidate>
    <h3>Delivery fee</h3>
    <div class="modes" role="radiogroup" aria-label="How delivery is charged">
      ${[['off','No fee set','Agree the delivery fee with the customer after the order'],['km','Per km from my shop','Base fee + a rate for every km to the customer'],['region','Per region','A fixed fee for each area you deliver to']].map(([k,t,d])=>`<label class="mode"><input type="radio" name="smode" value="${k}"${sh.mode===k?' checked':''}><span><b>${t}</b><small>${d}</small></span></label>`).join('')}
    </div>
    <div id="kmBox" class="sbox"${sh.mode==='km'?'':' hidden'}>
      ${addr.lat?'':`<p class="warnbox">Your shop isn't on the map yet. Add your full shop address in <a href="/account.html#settings">Settings → Edit details</a> (or use “I'm at my shop”) so distances can be worked out.</p>`}
      <div class="row3s"><label><span>Base fee</span><div class="unit2"><span>${esc(cur)}</span><input id="kBase" type="number" min="0" step="any" inputmode="decimal" value="${sh.km.base||0}"></div></label>
      <label><span>Per km</span><div class="unit2"><span>${esc(cur)}</span><input id="kPer" type="number" min="0" step="any" inputmode="decimal" value="${sh.km.perKm||0}"></div></label>
      <label><span>Max distance</span><div class="unit2"><span>km</span><input id="kMax" type="number" min="0" step="1" inputmode="numeric" value="${sh.km.maxKm||0}"></div></label></div>
      <label class="checkrow" style="margin-top:14px"><input type="checkbox" id="kExOn"${sh.km.express.enabled?' checked':''}> <span><b>Also offer Express (same day)</b><small>Its own base fee and rate per km.</small></span></label>
      <div class="row3s" id="kExBox"${sh.km.express.enabled?'':' hidden'}><label><span>Express base fee</span><div class="unit2"><span>${esc(cur)}</span><input id="kxBase" type="number" min="0" step="any" inputmode="decimal" value="${sh.km.express.base||0}"></div></label>
      <label><span>Express per km</span><div class="unit2"><span>${esc(cur)}</span><input id="kxPer" type="number" min="0" step="any" inputmode="decimal" value="${sh.km.express.perKm||0}"></div></label></div>
      <p class="msg" id="kEx"></p>
      <p class="msg" style="font-size:13px">Distance is by road from your shop address to the customer's address. Max distance 0 = no limit.</p>
    </div>
    <div id="regBox" class="sbox"${sh.mode==='region'?'':' hidden'}>
      <p class="msg" style="margin-bottom:8px">Customers pick their area and delivery speed at checkout. Leave a price empty if you don't offer that speed there (both empty = no delivery to that area).</p>
      <div class="reghead"><span>Region</span><span>Standard</span><span>Express</span><span></span></div>
      <div id="regs">${sh.regions.map(regRow).join('')}</div>
      <button type="button" class="madd2" id="regAdd">+ Add region</button>
    </div>
    <div id="spBox"${sh.mode==='off'?' hidden':''}><div class="sep2"></div>
    <h3 style="font-size:17px">Delivery times</h3>
    <div class="row3s"><label><span>Standard takes</span><input id="spStd" maxlength="30" value="${esc(sh.speeds.standardEta)}" placeholder="2–3 days"></label>
    <label><span>Express takes</span><input id="spEx" maxlength="30" value="${esc(sh.speeds.expressEta)}" placeholder="Same day"></label>
    <label><span>Express note (optional)</span><input id="spNote" maxlength="120" value="${esc(sh.speeds.expressNote)}" placeholder="Order before 2 pm"></label></div></div>
    <div class="sep2"></div>
    <label><span>Free delivery for orders over</span><div class="unit2"><span>${esc(cur)}</span><input id="sFree" type="number" min="0" step="any" inputmode="decimal" value="${sh.freeOver||0}"></div><small class="hint2">Applies to Standard delivery. 0 = always charge. Based on the items total before delivery.</small></label>
    <label class="checkrow"><input type="checkbox" id="sPick"${sh.pickup?.enabled?' checked':''}> <span><b>Offer free self-pickup from my shop</b><small>Customers can choose to collect instead of delivery. Your shop address is shown to them.</small></span></label>
    <label id="pickNoteL"${sh.pickup?.enabled?'':' hidden'}><span>Pickup note (optional)</span><input id="sPickNote" maxlength="160" value="${esc(sh.pickup?.note||'')}" placeholder="e.g. Pick up Sat–Thu, 4–9 pm. Call when you arrive."></label>
    <div class="err" id="shErr" role="alert"></div>
    <button class="btn plumb" type="submit" id="shSave">Save shipping settings</button>
    <p class="msg" id="shMsg" role="status"></p>
  </form>
  <div class="card"><h3>Your shop address</h3>
    <p style="margin:0 0 6px">${addr.text?esc(addr.text):'<span style="color:#c62f5f">Not set</span>'}</p>
    ${addr.lat?`<a class="maplink" href="https://www.openstreetmap.org/?mlat=${addr.lat}&mlon=${addr.lng}#map=16/${addr.lat}/${addr.lng}" target="_blank" rel="noopener">📍 Check the pin on the map</a>`:'<p class="msg" style="color:#8a5a00">Not found on the map yet.</p>'}
    <p style="margin-top:10px"><a class="mini" href="/account.html#settings">Change address</a></p>
    <div class="sep2"></div>
    <h3>What customers see</h3><div id="shPrev" class="prevbox"></div>
  </div></div>`;
  const read=()=>{sh.mode=(document.querySelector('input[name=smode]:checked')||{}).value||'off';
    sh.km={base:+$('kBase').value||0,perKm:+$('kPer').value||0,maxKm:+$('kMax').value||0,express:{enabled:$('kExOn').checked,base:+$('kxBase').value||0,perKm:+$('kxPer').value||0}};
    const pv=(r,k)=>{const v=r.querySelector(`[data-r=${k}]`).value;return v===''?null:Math.max(0,+v)};

  let buckets=[];

function renderInquiries(list){
  inqCache=list;
  const open=list.filter(q=>!['closed','converted'].includes(q.status)).length;
  $('icount').textContent=list.length?`${open} open · ${list.length} total`:'';
  if(!list.length){$('inquiries').innerHTML='<p class="msg">No inquiries yet. Customers can send custom requests with inspiration photos from the “Custom inquiry” section of your shop.</p>';return}
  $('inquiries').innerHTML=list.map(q=>{
    const photos=q.options.filter(o=>o.image).length,first=q.customer.name.split(/\s+/)[0];
    const replies=q.replies||[];
    const conv=q.status==='converted';
    return `<details class="ord" data-qid="${esc(q.id)}"${q.status==='new'||iqOpen.has(q.id)?' open':''}><summary><b>${esc(q.inqNo)}</b><span>${esc(q.customer.name)}</span><span>${q.quote?aed(q.quote.price):photos+' photo'+(photos===1?'':'s')}</span><span class="st st-${istClass[q.status]||'new'}">${esc((IST.find(s=>s[0]===q.status)||['','New'])[1])}</span><small>${esc(fmtDT(q.createdAt))} · ${replies.length?`Last reply ${esc(fmtDT(replies[replies.length-1].at))}`:'Not replied yet'}${conv?' · Order '+esc(q.orderNo):''}</small></summary>
    <div class="ob"><div>
      <p class="iqmsg">${esc(q.message)}</p>
      ${q.budget||q.neededBy?`<p class="msg">${q.budget?'Budget: <b>'+esc(q.budget)+'</b>':''}${q.budget&&q.neededBy?' · ':''}${q.neededBy?'Needed by: <b>'+esc(q.neededBy)+'</b>':''}</p>`:''}
      <div class="iqopts">${q.options.map(o=>`<figure>${o.image?`<a href="${esc(o.image)}" target="_blank" rel="noopener"><img src="${esc(o.image)}" alt="${esc(o.label)} inspiration photo" loading="lazy"></a>`:'<div class="noimg">No photo</div>'}<figcaption><b>${esc(o.label)}</b>${o.note?'<br>'+esc(o.note):''}</figcaption></figure>`).join('')||'<p class="msg">No photos attached.</p>'}</div>
      <h4 class="sub4">Replies to customer</h4>
      ${replies.length?`<ol class="thread">${replies.map(r=>`<li><small>${esc(fmtDT(r.at))}${r.emailSent?' · emailed':''}</small><p>${esc(r.message)}</p>${r.price!=null?`<b>Quoted ${aed(r.price)}</b>`:''}${r.readyBy?` <span class="msg">· ready by ${esc(r.readyBy)}</span>`:''}</li>`).join('')}</ol>`:'<p class="msg">You haven\'t replied yet.</p>'}
    </div>
    <div class="cust"><b>${esc(q.customer.name)}</b><br><a href="mailto:${esc(q.customer.email)}">${esc(q.customer.email)}</a><br>WhatsApp ${esc(q.customer.whatsapp)}${q.suggestedAddress?`<br><span>${esc(q.suggestedAddress)}</span>`:''}
      ${conv?`<div class="convok">Converted to order <b>${esc(q.orderNo)}</b>. You'll find it on the Orders page.<br><a href="#ord-${esc(q.orderId)}" class="mini" data-goorder="${esc(q.orderId)}" style="margin-top:6px">View order</a></div>`:`
      <form class="replyf" data-reply="${esc(q.id)}" novalidate>
        <label><span>Reply to ${esc(first)}</span><textarea name="message" maxlength="1500" required>${esc(`Hi ${first}, thank you for your custom inquiry! `)}</textarea></label>
        <div class="row2"><label><span>Quoted price (${esc(curUser.currency||'AED')}, optional)</span><input name="price" type="number" min="0" step="0.5" inputmode="decimal" value="${q.quote?q.quote.price:''}"></label><label><span>Ready by (optional)</span><input name="readyBy" type="date" value="${q.quote?.readyBy||''}"></label></div>
        <button class="btn plumb" type="submit" style="width:100%">Send reply</button>
        <p class="msg" style="margin:6px 0 0">Emailed to the customer, and WhatsApp opens with your reply ready to send. The status changes to Replied, or Quoted when you add a price.</p>
      </form>
      <div class="nbox" id="qn-${esc(q.id)}"></div>
      <label style="margin-top:12px"><span>Status</span><select data-q="${esc(q.id)}">${IST.filter(([k])=>k!=='converted').map(([k,t])=>`<option value="${k}"${k===q.status?' selected':''}>${t}</option>`).join('')}</select></label>
      ${inqUsage&&inqUsage.limit!==null&&inqUsage.used>=inqUsage.limit?`<div class="locked"><b>Convert to order is paused</b>You've used all ${inqUsage.limit} orders from inquiries on the Standard plan this month. You can still reply and quote — converting opens again on ${fmtDay(inqUsage.resetsOn)}, or straight away if you <a href="/account.html#settings">upgrade to Premium</a>.</div>`:`
      <details class="convert"${q.status==='accepted'?' open':''}><summary class="btn gold" style="width:100%">Convert to order${inqUsage&&inqUsage.limit!==null?` <small style="font-weight:600">(${inqUsage.limit-inqUsage.used} of ${inqUsage.limit} left this month)</small>`:''}</summary>
        <form class="convf" data-convert="${esc(q.id)}" novalidate>
          <p class="msg">Use this once ${esc(first)} has confirmed the agreed item and price. It creates a confirmed order, moves it to Orders, and sends the confirmation with a tracking link.</p>
          <label><span>Item</span><input name="name" maxlength="120" value="${esc('Custom order: '+q.message.slice(0,80))}"></label>
          <div class="row2"><label><span>Qty</span><input name="qty" type="number" min="1" max="99" step="1" value="1"></label><label><span>Price each (${esc(curUser.currency||'AED')})</span><input name="unitPrice" type="number" min="0" step="0.5" inputmode="decimal" value="${q.quote?q.quote.price:''}"></label></div>
          <label><span>Delivery address</span><textarea name="address" maxlength="400" placeholder="Building, street, area, city, emirate">${esc(q.suggestedAddress||'')}</textarea>${q.suggestedAddress?`<small class="hint2">${q.addressFrom==='inquiry'?'From the customer’s inquiry':'From the customer’s previous order '+esc(q.addressFrom)} — edit if needed</small>`:'<small class="hint2">No address on file for this customer — ask them and type it here</small>'}</label>
          <div class="row2"><label><span>Delivery fee (${esc(curUser.currency||'AED')})</span><input name="deliveryFee" type="number" min="0" step="any" inputmode="decimal" value="0"></label><label class="checkrow" style="margin-top:26px"><input type="checkbox" name="pickup"> <span>Customer will pick up</span></label></div>
          <label><span>Order notes (optional)</span><textarea name="notes" maxlength="800">${esc([q.options.map(o=>o.note&&o.label+': '+o.note).filter(Boolean).join('; '),q.neededBy?'Needed by '+q.neededBy:''].filter(Boolean).join(' · '))}</textarea></label>
          <div class="err" role="alert"></div>
          <button class="btn plumb" type="submit" style="width:100%">Create confirmed order</button>
        </form>
      </details>`}`}
      <button class="mini" type="button" data-qdel="${esc(q.id)}" style="color:#b02a5a;margin-top:10px">Delete inquiry</button></div></div></details>`}).join('');
  for(const d of $('inquiries').querySelectorAll('details.ord'))d.addEventListener('toggle',()=>{d.open?iqOpen.add(d.dataset.qid):iqOpen.delete(d.dataset.qid)});
  $('inquiries').onchange=async e=>{const sel=e.target.closest('select[data-q]');if(!sel)return;sel.disabled=true;
    const r=await api('/api/inquiries?id='+encodeURIComponent(sel.dataset.q),{method:'PUT',body:JSON.stringify({status:sel.value})}).catch(()=>({ok:false,data:{}}));
    if(r.ok)loadInquiries();else{sel.disabled=false;alertMsg(r.data.error||'Could not update the inquiry.')}};
  $('inquiries').onclick=async e=>{
    const g=e.target.closest('[data-goorder]');if(g){e.preventDefault();openOrderId=g.dataset.goorder;location.hash='#orders';return}
    const b=e.target.closest('[data-qdel]');if(!b)return;
    if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent='Tap again to delete';setTimeout(()=>{b.dataset.confirm='';b.textContent='Delete inquiry'},3000);return}
    b.disabled=true;const r=await api('/api/inquiries?id='+encodeURIComponent(b.dataset.qdel),{method:'DELETE'}).catch(()=>({ok:false,data:{}}));
    if(r.ok)loadInquiries();else{b.disabled=false;alertMsg('Could not delete the inquiry.')}};
  $('inquiries').onsubmit=async e=>{
    const f=e.target;e.preventDefault();
    if(f.dataset.reply){
      const id=f.dataset.reply,btn=f.querySelector('button[type=submit]');
      const d={message:f.message.value.trim(),price:f.price.value,readyBy:f.readyBy.value};
      if(d.message.length<2){f.message.focus();return}
      const w=window.open('about:blank','_blank');btn.disabled=true;btn.textContent='Sending…';
      const r=await api('/api/inquiries?id='+encodeURIComponent(id)+'&action=reply',{method:'POST',body:JSON.stringify(d)}).catch(()=>({ok:false,data:{}}));
      if(!r.ok){if(w)w.close();btn.disabled=false;btn.textContent='Send reply';const nb=$('qn-'+id);if(nb)nb.innerHTML=`<p class="nerr">${esc(r.data.error||'Could not send the reply.')}</p>`;return}
      iqOpen.add(id);renderInquiries(r.data.inquiries);loadInquiries().then(()=>showReplyNote(id,{...r.data.notification,auto:!!w}));
      const n=r.data.notification;if(w){if(n.whatsappUrl)w.location.href=n.whatsappUrl;else w.close()}
      showReplyNote(id,{...n,auto:!!w});
    }
    if(f.dataset.convert){
      const id=f.dataset.convert,btn=f.querySelector('button[type=submit]'),er=f.querySelector('.err');
      const d={items:[{name:f.name.value.trim(),qty:+f.qty.value||1,unitPrice:+f.unitPrice.value}],address:f.address.value.trim(),notes:f.notes.value.trim(),deliveryFee:f.pickup.checked?0:(+f.deliveryFee.value||0),pickup:f.pickup.checked};
      if(!d.items[0].name){f.name.focus();return er.textContent='Describe the item.'}
      if(!(d.items[0].unitPrice>0)){f.unitPrice.focus();return er.textContent='Enter the agreed price.'}
      if(d.address.length<8){f.address.focus();return er.textContent='Enter the delivery address.'}
      const w=window.open('about:blank','_blank');btn.disabled=true;btn.textContent='Creating order…';
      const r=await api('/api/inquiries?id='+encodeURIComponent(id)+'&action=convert',{method:'POST',body:JSON.stringify(d)}).catch(()=>({ok:false,data:{}}));
      if(!r.ok){if(w)w.close();btn.disabled=false;btn.textContent='Create confirmed order';er.textContent=r.data.error||'Could not create the order.';if(r.data.usage){setInqUsage(r.data.usage);renderInquiries(inqCache)}return}
      if(r.data.usage)setInqUsage(r.data.usage);
      const o=r.data.order,n=r.data.notification;
      loadInquiries();
      notes.set(o.id,{...n,auto:!!w});renderOrders(r.data.orders);
      if(w){if(n&&n.whatsappUrl)w.location.href=n.whatsappUrl;else w.close()}
      openOrderId=o.id;location.hash='#orders';
    }
  };
}
function showReplyNote(id,n){
  const box=$('qn-'+id);if(!box)return;
  box.innerHTML=`<div class="note-ok"><b>Reply sent</b>
    <div class="nrow"><span class="${n.emailSent?'ok':'warn'}">${n.emailSent?'✓ Emailed to customer':'Email not sent automatically'}</span>${n.mailtoUrl?`<a class="mini" href="${esc(n.mailtoUrl)}">Send email</a>`:''}</div>
    <div class="nrow"><span class="ok">${n.whatsappUrl?(n.auto?'✓ WhatsApp opened with your reply':'WhatsApp reply ready'):'No customer WhatsApp number'}</span>${n.whatsappUrl?`<a class="mini wa" href="${esc(n.whatsappUrl)}" target="_blank" rel="noopener">Open WhatsApp</a>`:''}</div></div>`;
}
function alertMsg(m){const p=$('pmsg');if(p)p.textContent=m}
$('logout').addEventListener('click',async()=>{await api('/api/logout',{method:'POST'}).catch(()=>{});showLogin('You have logged out.')});

(async()=>{
  const qs=new URLSearchParams(location.search),welcome=qs.has('welcome'),billing=qs.get('billing');
  if(qs.get('reset')){const tok=qs.get('reset');history.replaceState(null,'','/account.html');return showReset(tok)}
  if(welcome||billing)history.replaceState(null,'','/account.html'+location.hash);
  try{const r=await api('/api/me');if(!r.ok)return showLogin();billingInfo=r.data.billing||null;showAccount(r.data.user,welcome);
    if(billing==='cancelled')main.insertAdjacentHTML('afterbegin','<div class="ribbon" style="background:#ffe7b0;color:#6b4300">Payment cancelled — nothing was charged. You can pay any time from Settings.</div>');
    if(billing==='success'){
      // Stripe tells us about the payment a moment later; check a few times until the plan shows as active.
      main.insertAdjacentHTML('afterbegin','<div class="ribbon" id="payRib">Saving your billing details…</div>');
      for(let i=0;i<8;i++){await new Promise(ok=>setTimeout(ok,2000));const m=await api('/api/me').catch(()=>null);
        if(m&&m.ok&&m.data.user.subscription?.status==='active'){const su=m.data.user.subscription;showAccount(m.data.user,false);main.insertAdjacentHTML('afterbegin',su.paymentStatus==='card-added'&&su.trialEndsAt?`<div class="ribbon">Billing details saved — thank you! Your free trial continues and the first charge is on ${longDay(su.trialEndsAt)}.</div>`:`<div class="ribbon">Payment received — your ${esc(m.data.user.planDetails.name)} plan is active and your shop is open. Thank you!</div>`);return}}
      const pr=$('payRib');if(pr)pr.textContent='Payment received. Your plan will show as active in a minute — refresh the page if it doesn’t.'}
  }
  catch{showLogin()}
})();
}
</script>
</body>
</html>
